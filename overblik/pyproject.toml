[project]
name = "overblik"
version = "0.1.0"
description = "Ugentligt overblik på tværs af træning, økonomi og studie"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
liv = "overblik.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overblik"]

[tool.pytest.ini_options]
testpaths = ["tests"]

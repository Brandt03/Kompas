<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studie · Fag</title>
<!-- Studieprojektets side i Kompas (https://kompas.localhost/studie/fag.html). Kopieres af Scripts/kompas-eksport.js.
     Status er aflæst fra mappen (begreber, genkald, drills, afleveringer, forelæsninger og øvelser i Pensum/); køreplanen og fagnoterne (Word) er Studie-rutinens.
     Til eksamen (de gamle sæt pr. uge) kommer fra Studie-serveren (/eksamen/uger), som læser <mappe>/Eksamenstræning/.
     Siden skriver kun to ting, gennem Studie-serveren: læste uger (Styr på) og det, du skriver under I egne ord
     (<mappe>/egne-ord.md). -->
<link rel="stylesheet" href="/kompas/assets/tokens.css">
<link rel="stylesheet" href="/kompas/assets/page.css">
<style>
  .fag-head { display: flex; align-items: flex-start; gap: 14px; padding: 18px 20px; }
  .fag-head .sw { width: 6px; align-self: stretch; border-radius: 3px; flex: none; }
  .fag-head h2 { font-size: 17px; }
  .fag-head p { margin: 4px 0 0; color: var(--text-secondary); line-height: 1.5; }
  .fag-head p b { color: var(--text-primary); font-weight: 500; }
  .meter { height: 6px; border-radius: 3px; background: var(--surface-inset); overflow: hidden; margin-top: 8px; }
  .meter i { display: block; height: 100%; border-radius: 3px; background: var(--mark); }
  .rows { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
  .row .n { font-size: 13.5px; min-width: 0; }
  .row .v { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .meter { grid-column: 1 / -1; margin-top: 0; }
  .row small { display: block; color: var(--text-subdued); font-size: 12px; }
  table.g { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.g th { text-align: left; font-weight: 500; color: var(--text-secondary); padding: 6px 8px; border-bottom: 1px solid var(--divider); }
  table.g td { padding: 7px 8px; border-bottom: 1px solid var(--divider); }
  .files { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; color: var(--text-secondary); }
  .files li { display: flex; justify-content: space-between; gap: 10px; }
  .files li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files li span:last-child { color: var(--text-subdued); flex: none; font-variant-numeric: tabular-nums; }
  .plan-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  select { font: inherit; font-size: 13px; color: var(--text-primary); background: var(--container); border: 0; box-shadow: var(--shadow-border-xs); border-radius: 8px; padding: 5px 8px; }
  .weeknav { display: flex; align-items: center; gap: 6px; }
  .nav-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 8px; background: var(--container); box-shadow: var(--shadow-border-xs); color: var(--text-secondary); cursor: pointer; }
  .nav-btn:hover:not(:disabled) { color: var(--text-primary); background: var(--container-hover); }
  .nav-btn:disabled { opacity: .4; cursor: default; }
  .ind { display: grid; gap: 6px; }
  /* Rytme: selvstudie og svar pr. dag, en række pr. uge */
  .ry { display: grid; grid-template-columns: 38px repeat(7, minmax(0, 1fr)); gap: 4px; }
  .ry-h { font-size: 11px; color: var(--text-subdued); text-align: center; }
  .ry-u { font-size: 12px; color: var(--text-secondary); align-self: center; font-variant-numeric: tabular-nums; }
  .ry-c { height: 26px; border-radius: 6px; background: var(--surface-inset); display: grid; place-items: center; font-style: normal;
    font-size: 11px; font-weight: 500; color: var(--text-primary); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
  .ry-c.fremtid { background: none; box-shadow: inset 0 0 0 1px var(--divider); }
  .ry-c.idag { box-shadow: inset 0 0 0 1.5px var(--text-primary); }
  .ugeknap { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left;
    font: inherit; color: inherit; background: var(--container-inset); border: 0; box-shadow: inset 0 0 0 1px var(--border-subdued); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .ugeknap:hover { background: var(--surface-hover); }
  .ugeknap .chk { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--text-subdued); display: grid; place-items: center; color: transparent; }
  .ugeknap[aria-pressed="true"] .chk { background: var(--success); border-color: var(--success); color: #fff; }
  .ugeknap .u { min-width: 0; }
  .ugeknap .u b { font-weight: 500; font-size: 13.5px; }
  .ugeknap .u small { display: block; color: var(--text-secondary); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  details.sec { border-top: 1px solid var(--divider); padding-top: 12px; margin-top: 12px; }
  details.sec summary .meta { font-weight: 400; }
  .guide > details > summary { font-size: 14px; color: var(--text-primary); }
  .guide > details > summary b { font-weight: 500; }
  .guide .md ol > li { margin-bottom: 6px; }
  .guide .md img.model { display: block; max-width: min(100%, 720px); height: auto; margin: 10px 0 4px; border-radius: 8px; box-shadow: var(--shadow-border-xs); background: #fff; }
  .guide-nav { position: relative; }
  .tjek-uge { display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; margin: 4px 0 14px; }
  .tjek-uge .btn { display: inline-flex; text-decoration: none; white-space: nowrap; }
  .guide-nav > .weeknav { position: absolute; top: 12px; right: 16px; }
  .guide-nav > details > summary { padding: 6px 160px 6px 0; }
  .fn h4.fn-label { margin: 18px 0 6px; }
  .fn .fn-graa { color: var(--text-subdued); font-size: 12px; }
  .fn h4 .fn-graa em { font-style: normal; font-weight: 400; margin-left: 6px; }
  .fn .fn-midt { text-align: center; margin-bottom: 4px; }
  .fn img { display: block; max-width: 100%; height: auto; margin: 10px auto 4px; border-radius: 8px; box-shadow: var(--shadow-border-xs); background: #fff; }
  .fn pre { font-size: 12.5px; line-height: 1.5; }
  .fn table { border-collapse: collapse; font-size: 13px; }
  .fn td { border: 1px solid var(--divider); padding: 6px 8px; vertical-align: top; }
  .pl-uge { padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--divider); }
  .pl-k { font-size: 12px; color: var(--text-subdued); margin-bottom: 4px; }
  .pl { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13.5px; }
  .pl li { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .pl li .meta { flex: none; font-variant-numeric: tabular-nums; }
  .pl a { display: inline-flex; align-items: baseline; gap: 6px; min-width: 0; color: var(--text-primary); text-decoration: none; }
  .pl a svg { flex: none; position: relative; top: 2px; color: var(--text-secondary); }
  .pl a:hover span { text-decoration: underline; }
  textarea.egne { display: block; width: 100%; min-height: 140px; resize: vertical; margin-top: 10px; font: inherit; font-size: 14px; line-height: 1.55;
    color: var(--text-primary); background: var(--container-inset); border: 0; box-shadow: inset 0 0 0 1px var(--divider); border-radius: 10px; padding: 11px 13px; }
  textarea.egne:focus { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .egne-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .btn { font: inherit; font-size: 13px; font-weight: 500; line-height: 1; padding: 9px 13px; border-radius: 8px; border: 0; cursor: pointer; background: var(--nav-indicator); color: var(--container); }
  .btn:hover { opacity: .88; } .btn:disabled { opacity: .45; cursor: default; }
  .usb-kort { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; text-decoration: none; color: inherit; }
  .usb-kort:hover { background: var(--container-hover); }
  .usb-kort .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-inset); }
  .usb-kort b { display: block; font-weight: 600; }
  .usb-kort small { color: var(--text-secondary); font-size: 13px; line-height: 1.45; }
  .usb-kort .go { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  /* Til eksamen: ugens temaer i de gamle sæt */
  .tx { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .tx-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13.5px; }
  .tx-h b { font-weight: 500; min-width: 0; }
  .tx-h .meta { flex: none; font-variant-numeric: tabular-nums; }
  .tx-q { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; align-items: center; font-size: 12.5px; color: var(--text-secondary); }
  .tx-q a { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-inset); color: var(--text-secondary); text-decoration: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tx-q a:hover { color: var(--text-primary); }
  .tx-d { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 3px 8px; margin-top: 4px; font-size: 12.5px; color: var(--text-secondary); align-items: baseline; }
  .tx-d a { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-inset); color: var(--text-secondary); text-decoration: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Fag</h1>
      <p class="sub" id="sub">Status fra mappen og ugens plan pr. fag</p>
    </div>
    <div class="seg" role="tablist" aria-label="Vælg fag" id="tabs"></div>
  </header>
  <div class="stack" id="root"><div class="card empty">Henter …</div></div>
</div>

<script src="/kompas/assets/icons.js"></script>
<script src="/kompas/assets/liv.js"></script>
<script src="studie.js"></script>
<script>
// #<fag> eller #<fag>/<uge> (fx fra Tjek ugen først på Træning); tomt: det første fag i fag.json
let S = null, valgt = location.hash.slice(1).split("/")[0], planUge = null;
const hashUge = () => +location.hash.split("/")[1] || null;
let guideAaben = false;   // Studieguiden er lukket, til du åbner den; derefter følger den med, når du skifter uge
// Kapitelresuméerne pr. fag og uge (resumeer.json fra kompas-eksport.js); lukket ligesom guiden
let RS = null, resumeAaben = false;
// Styr på: hvilke uger du har læst (live fra Scripts/kompas-server.js). Styrer nye kort i Dagens kort i fag med genkald;
// i fag uden bruger Studie-rutinen markeringerne til indhentningen.
let LAEST = null, GK = null;
// Fagnoterne (Word), udfyldt af Studie-rutinen efter ugen, når slides er lagt op (fagnoter.json fra kompas-eksport.js)
let FN = null;
// Til eksamen: de gamle sæt pr. uge (/eksamen/uger fra Studie-serveren); false, hvis serveren ikke svarer
let EU = null;
// I egne ord: { fag: { uge: tekst } } live fra Scripts/kompas-server.js, som gemmer i <mappe>/egne-ord.md.
// Det, du ikke har gemt endnu, ligger som kladde i browseren, så det overlever et ugeskift.
let EO = null;
const kladde = { hent: k => { try { return localStorage.getItem("kladde:" + k); } catch (e) { return null; } },
  gem: (k, v) => { try { v == null ? localStorage.removeItem("kladde:" + k) : localStorage.setItem("kladde:" + k, v); } catch (e) {} } };
const egneStatus = (gemt, kl) => !EO ? "Studie-serveren svarer ikke, så der kan ikke gemmes lige nu"
  : kl != null && kl.trim() !== gemt ? "ikke gemt" : gemt ? "gemt" : "tom";
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const meter = (a, b) => `<div class="meter" role="img" aria-label="${a} af ${b}"><i style="width:${pct(a, b)}%"></i></div>`;
const kort = iso => { if (!iso) return "–"; const d = new Date(iso); return `${d.getDate()}/${d.getMonth() + 1}`; };

function tiles(f) {
  const s = f.status, t = [];
  if (s.begreber) t.push(`<div class="card tile"><div class="label">Begreber i egne ord</div><div class="value">${s.begreber.udfyldt}<small>/ ${s.begreber.i_alt}</small></div>${meter(s.begreber.udfyldt, s.begreber.i_alt)}<div class="foot">ændret ${kort(s.begreber.ændret)}</div></div>`);
  if (s.genkald_i_alt) {
    const i = s.genkald_i_alt, g = { q: i.spoergsmaal, m: i.forsoegt, sad: i.sad };  // talt af eksporten
    t.push(`<div class="card tile"><div class="label">Genkald forsøgt</div><div class="value">${g.m}<small>/ ${g.q}</small></div>${meter(g.m, g.q)}<div class="foot">${g.sad} sad helt</div></div>`);
  }
  if (s.modeller != null) t.push(`<div class="card tile"><div class="label">Tegnede modeller</div><div class="value">${s.modeller}</div><div class="foot">i ${esc(f.mappe)}/Modeller</div></div>`);
  if (s.drills_i_alt) {
    const i = s.drills_i_alt, d = { p: i.pladser, g: i.gaettet, st: i.stubbe };  // talt af eksporten
    t.push(`<div class="card tile"><div class="label">Drills gættet</div><div class="value">${d.g}<small>/ ${d.p}</small></div>${meter(d.g, d.p)}<div class="foot">${d.st} kodestubbe tilbage</div></div>`);
  }
  if (s.afleveringer) t.push(`<div class="card tile"><div class="label">${esc(f.afleveringer?.navn || "Afleveringer")} godkendt</div><div class="value">${s.afleveringer.godkendt}<small>/ ${s.afleveringer.krav ?? "–"} krævet</small></div>${meter(s.afleveringer.godkendt, s.afleveringer.krav || 1)}<div class="foot">${s.afleveringer.afleveret} afleveret af ${s.afleveringer.ud_af ?? 8}</div></div>`);
  if (s.oevelser_i_gang) t.push(`<div class="card tile"><div class="label">Øvelser</div><div class="value">${s.oevelser_faerdige}<small>færdige</small></div><div class="foot">${s.oevelser_i_gang.length} i gang: ${esc(s.oevelser_i_gang.join(", ")) || "ingen"}</div></div>`);
  t.push(`<div class="card tile"><div class="label">Aktivitet, 7 dage</div><div class="value">${s.aktivitet.length}${s.aktivitet.length >= 12 ? "+" : ""}<small>filer</small></div><div class="foot">i dine arbejdsmapper</div></div>`);
  return `<section class="tiles">${t.join("")}</section>`;
}

function detaljer(f) {
  const s = f.status, parts = [];
  if (s.begreber?.uger?.length) parts.push(`<section class="card panel"><div class="panel-head"><h2>Begreber pr. uge</h2><span class="meta">${f.kort}/Genkald/begreber.md</span></div>
    <div class="rows">${s.begreber.uger.map(u => `<div class="row"><span class="n">${esc(u.uge)}</span><span class="v">${u.udfyldt} / ${u.i_alt}</span>${meter(u.udfyldt, u.i_alt)}</div>`).join("")}</div></section>`);
  if (s.genkald?.length) parts.push(`<section class="card panel"><div class="panel-head"><h2>Genkald</h2><span class="meta">markér [✓] [~] [✗] i filen</span></div>
    <div class="rows">${s.genkald.map(g => `<div class="row"><span class="n">${esc(g.uger)}<small>${esc(g.fil)}</small></span>
      <span class="v">${g.sad} sad · ${g.halvt} halvt · ${g.blankt} blankt · ${g.umarkeret} ikke forsøgt</span>${meter(g.sad + g.halvt + g.blankt, g.spoergsmaal)}</div>`).join("")}</div></section>`);
  if (s.drills?.length) parts.push(`<section class="card panel"><div class="panel-head"><h2>Drills</h2><span class="meta">${esc(`${f.mappe}/${f.kode}/Drills`)}</span></div>
    <div class="rows">${s.drills.map(d => `<div class="row"><span class="n">${esc(d.titel)}<small>${esc(d.fil)}${d.stubbe ? ` · ${d.stubbe} kodestubbe` : ""}</small></span>
      <span class="v">${d.gættet} / ${d.pladser} gættet</span>${meter(d.gættet, d.pladser)}</div>`).join("")}</div></section>`);
  if (s.afleveringer) parts.push(`<section class="card panel"><div class="panel-head"><h2>${esc(f.afleveringer?.navn || "Afleveringer")}</h2><span class="meta">${s.afleveringer.krav} af ${s.afleveringer.ud_af} skal godkendes</span></div>
    <div style="overflow-x:auto"><table class="g"><thead><tr><th>Opgave</th><th>Uge</th><th>Afleveret</th><th>Godkendt</th><th>Hvad drillede</th></tr></thead>
    <tbody>${s.afleveringer.raekker.map(r => `<tr><td>${esc(r.opgave)}${r.mappe ? "" : ` <span class="meta">(ingen mappe)</span>`}</td><td>${esc(r.uge || "–")}</td><td>${esc(r.afleveret || "–")}</td><td>${esc(r.godkendt || "–")}</td><td>${esc(r.drillede || "")}</td></tr>`).join("")}</tbody></table></div></section>`);
  return parts.length > 1 ? `<div class="cols">${parts.join("")}</div>` : parts.join("");
}

function plan(f) {
  const planer = S.planer.filter(p => p.fag[f.id]);
  if (!planer.length) return "";
  // I weekenden er næste uges køreplan ikke skrevet endnu; så vises sidste uges med et mærke (koereplan i studie.js)
  const v = visUge(), kp = koereplan(planer, planUge, v);
  const p = kp.plan || planer.find(x => x.uge === S.aktuel_uge) || planer[planer.length - 1];
  const i = planer.indexOf(p), a = p.fag[f.id];
  const naar = kp.sidste ? ` <span class="badge">${SIDSTE_UGES}</span>`
    : `<span class="meta">${p.uge === v.uge ? (v.naeste ? " · næste uge" : " · denne uge") : v.naeste && p.uge === S.aktuel_uge ? " · sidste uge" : ""} · skrevet før ugen</span>`;
  const sek = (k, titel, aaben) => a[k] ? `<details class="sec"${aaben ? " open" : ""}><summary>${titel}</summary><div class="md">${a[k]}</div></details>` : "";
  // Ugens noter står i fagnoterne i Word: skrevet foreløbigt søndagen før ugen og rettet søndagen efter, når slides
  // og øvelser er kommet. Ældre køreplaner (og en uge, hvor dokumentet var åbent) har i stedet "Noter til pensum".
  const fd = FN?.[f.id], u = fd?.uger?.[p.uge], fn = u?.udfyldt || u?.foreloebig ? u : null;
  const fnMeta = !fn ? "" : fn.foreloebig ? "foreløbig, skrevet før ugen; rettes søndagen efter ugen"
    : fn.kun_bog ? "rettet efter ugen, kun ud fra bogen (slides var ikke lagt op)" : "rettet efter ugen ud fra slides og bog";
  const noter = (fn
      ? `<details class="sec" open><summary>Fagnoter <span class="meta">· ${fnMeta}</span></summary>
          <div class="md fn">${fn.html}</div><p class="meta" style="margin:12px 0 0">Fra ${esc(fd.fil)}, ændret ${kort(fd.ændret)}.</p></details>`
      : a["Noter til pensum"] ? ""
      : `<p class="meta" style="border-top:1px solid var(--divider);padding-top:12px;margin:12px 0 0">Fagnoter: skrives af Studie-rutinen søndag før ugen.</p>`)
    + sek("Noter til pensum", `Noter til pensum <span class="meta">· fra køreplanen, skrevet før ugen${fn ? " (fagnoterne ovenfor er de samlede)" : ""}</span>`)
    + sek("Træning", `Træning <span class="meta">· fra køreplanen</span>`);
  // Køreplanens øvelses- eller pensumspørgsmål, med svaret skjult, til du har svaret selv
  const o = a.oevelse, oTitel = o && /Pensumspørgsmål/.test(o.spoergsmaal) ? "Pensumspørgsmål" : "Øvelsesspørgsmål";
  const oevelse = o ? `<details class="sec"><summary>${oTitel} <span class="meta">· fra køreplanen</span></summary><div class="md">${o.spoergsmaal}</div>
    <details style="margin-top:12px"><summary>Vis svar – når du har svaret selv</summary><div class="md" style="margin-top:8px">${o.svar}</div></details></details>` : "";
  // Dit eget felt til ugen. Står der også noget under "I egne ord" i Word, ses det under Fagnoter.
  const gemt = EO?.[f.id]?.[p.uge] || "", k = `egne:${f.id}:${p.uge}`, kl = kladde.hent(k);
  const egne = `<details class="sec" open><summary>I egne ord <span class="meta" id="egne-status">· ${egneStatus(gemt, kl)}</span></summary>
    <textarea class="egne" id="egne" data-k="${k}" data-uge="${p.uge}" aria-label="I egne ord, uge ${p.uge}"
      placeholder="Forklar ugens stof med dine egne ord, uden bogen …"${EO ? "" : " disabled"}>${esc(kl ?? gemt)}</textarea>
    <div class="egne-bar"><span class="meta">Gemmes i ${esc(f.mappe)}/egne-ord.md · ⌘↵ gemmer</span>
      <button type="button" class="btn" id="egne-gem"${EO ? "" : " disabled"}>Gem</button></div></details>`;
  // Valgfrie LeetCode-opgaver til ugen (leetcode i fag.json, fx Gamma/leetcode.md). Kun links og hvad de træner, aldrig løsninger.
  const lc = S.leetcode?.fag === f.id ? S.leetcode.uger?.[p.uge] : null;
  const leet = lc ? `<details class="sec"><summary>LeetCode <span class="meta">· ${lc.opgaver.length ? `${lc.opgaver.length} opgaver, valgfrit` : "ingen denne uge"}</span></summary>
      <div class="md">${lc.note || ""}${lc.opgaver.length ? `<ul>${lc.opgaver.map(o => `<li><a href="${esc(o.url)}" target="_blank" rel="noopener">${o.nr}. ${esc(o.titel)}</a>
        <span class="meta">${esc(o.niveau)}</span>${o.hvorfor ? ` · ${o.hvorfor}` : ""}</li>`).join("")}</ul>` : ""}</div>
      <p class="meta" style="margin:12px 0 0">Fra ${esc(S.leetcode.fil)}.</p></details>` : "";
  // Ugevælgeren står i guidens første linje, når faget har en guide: så bliver den på sin plads, mens du bladrer,
  // selvom guiden og resuméet fylder forskelligt fra uge til uge.
  const nav = `<div class="weeknav">
        <button type="button" class="nav-btn" data-step="-1" aria-label="Ugen før"${i === 0 ? " disabled" : ""}>${icon("arrow-left", 14)}</button>
        <select id="uge" aria-label="Vælg uge">${planer.map(x => `<option value="${x.uge}"${x.uge === p.uge ? " selected" : ""}>Uge ${x.uge}</option>`).join("")}</select>
        <button type="button" class="nav-btn" data-step="1" aria-label="Ugen efter"${i === planer.length - 1 ? " disabled" : ""}>${icon("arrow-right", 14)}</button>
      </div>`;
  const g = guide(f, p, nav);
  return `${g}${resume(f, p.uge)}<section class="card panel">
    <div class="plan-head"><h2>Køreplan, uge ${p.uge} <span class="meta">(${range(p.fra)})</span>${naar}</h2>
      ${g ? "" : nav}</div>
    ${pensum(f, p.uge)}
    ${a["Hurtigt overblik"] ? `<div class="md">${a["Hurtigt overblik"]}</div>` : ""}
    ${tilEksamen(f, p.uge)}
    ${a["Til rapporten"] ? `<div class="banner" style="padding:12px 0 0"><span class="bi">${icon("sparkles", 16)}</span><div><div class="bl">Til rapporten</div><div class="md">${a["Til rapporten"]}</div></div></div>` : ""}
    ${a.Video ? `<div class="banner" style="padding:12px 0 0"><span class="bi">${icon("external-link", 16)}</span><div><div class="bl">Video</div><div class="md">${a.Video}</div></div></div>` : ""}
    ${noter}
    ${oevelse}
    ${egne}
    ${leet}
    ${sek("Kilder", "Kilder")}
    ${a["Hurtigt overblik"] ? "" : sek("intro", "Hele afsnittet", true)}
    <p class="meta" style="margin:12px 0 0">Fra ${esc(p.fil)}, skrevet af Studie-rutinen.</p>
  </section>`;
}

// Studieguide til ugen (studieguide i fag.json, fx Alfa/studieguide.md): i hvilken rækkefølge du lærer ugens pensum
// hurtigst, med forelæsning, øvelser, bog og videoer, og hvad du gør med kun én time. Fagets generelle tilgang står under.
function guide(f, p, nav) {
  const g = S.studieguide?.[f.id];
  if (!g) return "";
  const uge = p.uge, u = g.uger[uge], forbi = p.fra < visUge().mandag;   // en uge, der er gået, uden guide: fx ferie
  const meta = u ? [u.emne, u.videoer ? `${u.videoer} ${u.videoer === 1 ? "video" : "videoer"}` : ""].filter(Boolean).join(" · ")
    : forbi ? "ingen guide til ugen" : "ingen guide til ugen endnu";
  // Tjek ugen først: ugens genkaldsspørgsmål koldt og med sikkerhed, før du læser, så du kan springe det over, du
  // allerede kan. Kun fag med genkald; GK kommer fra Studie-serveren og mangler, når den ikke svarer
  const tjek = f.genkald ? (GK || []).filter(x => x.fag === f.id).flatMap(x => x.spoergsmaal).filter(q => q.uge === +uge) : [];
  const svaret = tjek.filter(q => q.mark).length;
  // Uden spørgsmål til ugen siger linjen hvorfor, så knappen ikke bare er væk: Studie-rutinen laver genkald søndag
  // efter ugen, og kun til uger med forelæsning eller øvelse i mappen (samme kilde som Styr på)
  const iMappen = [...(f.status.pensum?.forelaesninger || []), ...(f.status.pensum?.oevelser || [])].some(x => x.uge === +uge);
  const udenTjek = !f.genkald || !GK ? ""
    : !forbi ? `Ugens genkaldsspørgsmål kommer, når Studie-rutinen kører søndag efter ugen. Så kan du tjekke ugen her.`
    : !iMappen ? `Der er hverken forelæsning eller øvelse i mappen til uge ${+uge}, så ugen har ingen genkaldsspørgsmål.`
    : `Ugen har ingen genkaldsspørgsmål endnu. Studie-rutinen laver dem søndag, når ugens slides ligger i mappen.`;
  const tjekLinje = tjek.length ? `<div class="tjek-uge"><a class="btn" href="genkald.html?fag=${encodeURIComponent(f.id)}&uge=${+uge}#genkald">Tjek ugen først</a>
    <span class="meta">${tjek.length} genkaldsspørgsmål fra hukommelsen, med sikkerhed, før du læser. Spring de skridt over, du var sikker på og havde ret i.${svaret ? ` Du har svaret på ${svaret}.` : ""}</span></div>`
    : udenTjek ? `<div class="tjek-uge"><span class="meta">${udenTjek}</span></div>` : "";
  return `<section class="card panel guide guide-nav">${nav}<details id="guide"${guideAaben ? " open" : ""}>
    <summary><b>Sådan lærer du uge ${uge}</b> <span class="meta">· ${esc(meta)}</span></summary>
    ${tjekLinje}
    ${u ? `<div class="md">${u.html}</div>` : forbi ? "" : `<p class="meta" style="margin:0">Studie-rutinen skriver guiden til ugen søndag før ugen.</p>`}
    ${g.intro ? `<details class="sec"><summary>Generelt i ${esc(f.kort)}</summary><div class="md">${g.intro}</div></details>` : ""}
    <p class="meta" style="margin:12px 0 0">Fra ${esc(g.fil)}.</p></details></section>`;
}

// Resumé af ugens kapitler (resumeer i fag.json, fx Alfa/Resumeer/): vægtet efter eksamen med ★ og ○ og "Kan springes
// over". Et kort over kapitlet før bogens ★-afsnit, ikke i stedet for dem. Flere kapitler i ugen står hver for sig.
function resume(f, uge) {
  const r = RS?.[f.id];
  if (!r) return "";
  const liste = r.uger[uge] || [];
  if (!liste.length) return "";
  const min = Math.max(5, Math.round(liste.reduce((n, x) => n + x.ord, 0) / 200 / 5) * 5);
  const titel = x => esc(x.titel.replace(/\s*—\s*/, " · "));
  const indhold = liste.length === 1 ? `<div class="md">${liste[0].html}</div>`
    : liste.map(x => `<details class="sec"><summary>${titel(x)} <span class="meta">· ${x.ord} ord</span></summary><div class="md">${x.html}</div></details>`).join("");
  return `<section class="card panel guide"><details id="resume"${resumeAaben ? " open" : ""}>
    <summary><b>Resumé, uge ${uge}</b> <span class="meta">· ${liste.length === 1 ? titel(liste[0]) : `${liste.length} kapitler`} · ca. ${min} min læsning</span></summary>
    ${indhold}
    <p class="meta" style="margin:12px 0 0">Fra ${liste.map(x => esc(x.fil)).join(", ")}. Læs resuméet først og derefter bogens ★-afsnit.</p></details></section>`;
}

// Til eksamen: hvad de gamle sæt har spurgt om fra ugens stof (/eksamen/uger fra Studie-serveren), så du ved, hvad
// der vejer, før du læser. Et fag med temaer pr. uge viser de hyppigste temaer først; et fag, hvis opgaver er
// mærket med kapitel, viser opgaverne, hvor ugens kapitel er hovedemnet; et fag uden gamle sæt dine egne
// pensumspørgsmål. ✓ ~ ✗ er dit seneste svar på Eksamen-siden, og hvert nummer åbner opgaven dér.
const saetKort = id => id.replace(/-ordinaer$/, " ordinær").replace(/-reeksamen$/, " reeksamen");
const tal = (x, d = 1) => (Math.round(x * 10 ** d) / 10 ** d).toLocaleString("da-DK");
function tilEksamen(f, uge) {
  const d = EU?.[f.id];
  if (!d) return EU === false && f.eksamenstraening ? `<p class="meta" style="border-top:1px solid var(--divider);padding-top:12px;margin:12px 0 0">Til eksamen: kan ikke vises, fordi Studie-serveren ikke svarer.</p>` : "";
  const w = d.uger[uge], mrk = x => x.resultat ? ` ${MARK_EKS[x.resultat]}` : "";
  const link = (x, tekst) => `<a href="eksamen.html#${encodeURIComponent(f.id)}/${encodeURIComponent(x.saet)}/${x.nr}" title="${esc(x.emne)}">${esc(tekst)}${mrk(x)}</a>`;
  const ramme = (meta, indhold, note) => `<details class="sec" open><summary>Til eksamen <span class="meta">· ${meta}</span></summary>${indhold}
    <p class="meta" style="margin:12px 0 0;line-height:1.5">${note}</p></details>`;
  // Uden gamle sæt: dine egne pensumspørgsmål til ugen
  if (!d.saet_i_alt) {
    const egne = w?.egne || [];
    return ramme("ingen gamle sæt", egne.length ? `<div class="tx-d">${egne.map(x => `${link(x, `spm. ${x.nr}`)}<span>${esc(x.emne)}</span><span></span>`).join("")}</div>` : "",
      `${esc(f.kort)} har ingen gamle eksamenssæt. ${egne.length ? "Spørgsmålene er dine egne pensumspørgsmål til ugen, ikke uddannelsens." : "Der er ingen pensumspørgsmål til ugen endnu."}`);
  }
  const ugensKap = Object.entries(d.kapitler || {}).filter(([, us]) => us.includes(uge)).map(([k]) => +k);
  if (!w?.grupper.length) return ramme("intet i de gamle sæt", "", Object.keys(d.kapitler || {}).length && !ugensKap.length
    ? `Ugen har ingen kapitler i bogen (kapitler i Scripts/undervisningsdage.json), så den kan ikke kobles til de gamle opgaver.`
    : `Ingen af de ${d.saet_i_alt} gamle sæt har spurgt om ugens stof.`);
  const andel = w.andel != null ? ` · ≈ ${tal(100 * w.andel, 0)} % af pointene` : "";
  // Kapitelfag: opgaverne i sættene, hvor ugens kapitel er hovedemne, og for sig dem, der også bruger det
  if (w.grupper[0].sektion != null) {
    const opg = g => `<li><div class="tx-h"><b>${esc(saetKort(g.spoergsmaal[0].saet))} · ${esc(g.sektion)}</b><span class="meta">${g.hoved ? `${tal(g.spoergsmaal.filter(x => x.hoved).reduce((a, x) => a + 100 * (x.andel || 0), 0), 0)} %` : ""}</span></div>
      <div class="tx-d">${g.spoergsmaal.map(x => `${link(x, `spm. ${x.nr}`)}<span>${esc(x.emne)}</span><span class="meta">${x.point != null ? `${tal(x.point, 0)} %` : ""}</span>`).join("")}</div></li>`;
    const hoved = w.grupper.filter(g => g.hoved), andre = w.grupper.filter(g => !g.hoved);
    const kap = ugensKap.length ? `kap. ${ugensKap.join(", ")}` : "ugens kapitel";
    return ramme(`${kap} er hovedemne i ${w.saet_med} af ${d.saet_i_alt} gamle sæt${andel}`,
      (hoved.length ? `<ul class="tx">${hoved.map(opg).join("")}</ul>` : `<p class="meta" style="margin:10px 0 0">Ugens kapitel er ikke hovedemnet i nogen opgave.</p>`)
      + (andre.length ? `<details style="margin-top:12px"><summary class="meta">Bruger også ${kap}: ${andre.length} ${andre.length === 1 ? "opgave" : "opgaver"}</summary><ul class="tx">${andre.map(opg).join("")}</ul></details>` : ""),
      `Opgaverne i ${esc(f.mappe)}/Eksamenstræning, hvis første kapitel er ugens (nyeste sæt først); procent er delopgavens vægt i sættet.`);
  }
  // Temafag: hyppigste temaer først, med form, point pr. sæt og hvert spørgsmål
  const former = g => Object.entries(g.spoergsmaal.reduce((a, x) => ((a[x.form] ||= { n: 0, p: 0 }).n++, a[x.form].p += x.point || 0, a), {}))
    .map(([k, v]) => `${k} ×${v.n} (${tal(v.p)} p)`).join(" · ");
  return ramme(`i ${w.saet_med} af ${d.saet_i_alt} gamle sæt${andel}`,
    `<ul class="tx">${w.grupper.map(g => `<li><div class="tx-h"><b>${esc(g.navn)}</b><span class="meta" title="I snit pr. sæt, af ${d.saet[0]?.total || "?"} point">${g.saet.length} af ${d.saet_i_alt} sæt · ≈ ${tal(g.point)} p</span></div>
      <div class="tx-q"><span>${esc(former(g))}</span>${g.spoergsmaal.map(x => link(x, `${saetKort(x.saet)} · ${x.nr}`)).join("")}</div></li>`).join("")}</ul>`,
    `Talt i de ${d.saet_i_alt} gamle sæt i ${esc(f.mappe)}/Eksamenstræning. "≈ p" er temaets point i snit pr. sæt (af ${d.saet[0]?.total || "?"})${
      w.grupper.some(g => g.spoergsmaal.some(x => ["MC", "model", "kortsvar"].includes(x.form))) ? "; MC, model og kortsvar er sættets multiple choice, tegne- og modelleringsopgaver og kortsvar" : ""}.`);
}
const MARK_EKS = { sad: "✓", halvt: "~", blankt: "✗" };

// Ugens forelæsninger og øvelser fra <mappe>/Pensum/, øverst i køreplanen. Filen åbnes gennem Studie-serveren; på
// telefonen i samme vindue, så På fartens service worker kan vise den uden net (et nyt vindue har ikke dens lager).
function pensum(f, uge) {
  const p = f.status.pensum, fl = (p?.forelaesninger || []).filter(x => x.uge === uge), oe = (p?.oevelser || []).filter(x => x.uge === uge);
  if (!fl.length && !oe.length) return "";
  const link = x => `<li><a href="/studie/api/pensum/${encodeURIComponent(f.id)}/${encodeURIComponent(x.mappe)}/${encodeURIComponent(x.fil)}"${paaTelefon ? "" : ` target="_blank" rel="noopener"`}>
    ${icon("file-text", 14)}<span>${esc(x.titel)}</span></a><span class="meta">${dayMonth(parseDate(x.dato))}</span></li>`;
  const kol = (navn, xs) => `<div><div class="pl-k">${navn}</div>${xs.length ? `<ul class="pl">${xs.map(link).join("")}</ul>` : `<p class="meta" style="margin:0">Ikke lagt op</p>`}</div>`;
  return `<div class="cols pl-uge">${kol("Forelæsning", fl)}${kol("Øvelse", oe)}</div>`;
}

let STYR_FEJL = null;
function styrPaa(f) {
  if (STYR_FEJL) return `<section class="card panel"><div class="panel-head"><h2>Styr på</h2></div>
    <p class="meta" style="margin:0">Kan ikke vises lige nu, fordi Studie-serveren ikke svarer (${esc(STYR_FEJL)}). Genstart:
    <code>launchctl kickstart -k gui/$(id -u)/local.kompas.studie</code>, og se <code>~/.kompas/studie-server.log</code>.</p></section>`;
  if (!LAEST) return "";
  // Uger med undervisning i faget: dem planerne har et afsnit for, til og med denne uge. Fag uden genkald har intet
  // spørgsmål at tage emnet fra, så dér er det ugens forelæsning, og uger uden forelæsning eller øvelse (ferie) er ude
  const fl = f.status.pensum?.forelaesninger || [], oe = f.status.pensum?.oevelser || [];
  const uger = S.planer.filter(p => p.fag[f.id] && +p.uge <= +S.uge_nu
    && (f.genkald || [...fl, ...oe].some(x => x.uge === +p.uge))).map(p => p.uge);
  if (!uger.length) return "";
  const qs = (GK || []).filter(x => x.fag === f.id).flatMap(x => x.spoergsmaal);
  const emne = u => { if (!f.genkald) return fl.find(x => x.uge === +u)?.titel || "";
    const q = qs.find(x => x.uge === u); return q ? q.afsnit.replace(/^Uge\s+\d+\s*[—–-]\s*/i, "") : ""; };
  const l = LAEST[f.id] || {}, n = uger.filter(u => l[u]).length;
  return `<section class="card panel">
    <div class="panel-head"><h2>Styr på</h2><span class="meta">${n} af ${uger.length} uger læst</span></div>
    <div class="meter" style="margin:-4px 0 14px"><i style="width:${Math.round(100 * n / uger.length)}%"></i></div>
    <div class="ind">${uger.map(u => { const q = qs.filter(x => x.uge === u).length, d = l[u];
      return `<button type="button" class="ugeknap" data-uge="${u}" aria-pressed="${!!d}">
        <span class="chk">${icon("check", 13)}</span>
        <span class="u"><b>Uge ${u}</b><small>${esc(emne(u) || (f.genkald ? "ingen genkaldsspørgsmål endnu" : "ingen forelæsning lagt op"))}</small></span>
        <span class="meta">${d ? `læst ${dayMonth(parseDate(d))}` : q ? `${q} spørgsmål venter` : ""}</span></button>`; }).join("")}</div>
    <p class="meta" style="margin:12px 0 0;line-height:1.5">${f.genkald
      ? "Markér en uge, når du har læst den. Så kommer dens genkaldsspørgsmål med i Dagens kort, op til 5 nye om dagen. Uger, du ikke har markeret, holdes ude, så du ikke genkalder stof, du ikke har læst."
      : "Markér en uge, når du har læst den. Studie-rutinen planlægger indhentningen efter de uger, du ikke har markeret. Faget har ingen genkald, så markeringen ændrer ikke Dagens kort."}</p>
  </section>`;
}

// Rytme: selvstudiet og svarene pr. dag er talt af eksporten (status.rytme); siden lægger dem bare i et gitter, uge for uge.
// Dagens farve følger det af de to, der fylder mest i forhold til fagets travleste dag.
function rytme(f) {
  const r = f.status.rytme;
  if (!r?.fra) return "";
  const slut = parseDate(r.til), uger = [];
  for (let m = parseDate(r.fra); m <= slut; m = addDays(m, 7)) uger.push(m);
  const celle = d => {
    if (d > slut) return `<i class="ry-c fremtid"></i>`;
    const k = iso(d), n = r.dage[k] || 0, t = r.timer?.[k] || 0;
    const styrke = Math.max(r.flest ? n / r.flest : 0, r.flest_timer ? t / r.flest_timer : 0);
    const farve = styrke ? ` style="background:color-mix(in srgb, ${f.farve} ${Math.round(25 + 75 * styrke)}%, transparent)"` : "";
    const hvad = [t && `${tal(t)} t selvstudie`, n && `${n} svar`].filter(Boolean).join(", ") || "intet";
    return `<i class="ry-c${k === r.til ? " idag" : ""}" title="${weekday(d)} ${dayMonth(d)}: ${hvad}"${farve}>${[t && `${tal(t)} t`, n].filter(Boolean).join(" · ")}</i>`;
  };
  const dele = [r.timer_i_alt && `${tal(r.timer_i_alt)} t selvstudie`, r.svar && `${r.svar} svar`].filter(Boolean);
  return `<section class="card panel">
    <div class="panel-head"><h2>Rytme</h2><span class="meta">${dele.length ? `${dele.join(" · ")} på ${r.aktive_dage} ${r.aktive_dage === 1 ? "dag" : "dage"} · senest ${dayMonth(parseDate(r.seneste))}` : "intet endnu"}</span></div>
    <div class="ry"><span></span>${DAYS.map(d => `<span class="ry-h">${d.slice(0, 3)}</span>`).join("")}
      ${uger.map(m => `<span class="ry-u">U${isoWeek(m)}</span>${[0, 1, 2, 3, 4, 5, 6].map(i => celle(addDays(m, i))).join("")}`).join("")}</div>
    <p class="meta" style="margin:12px 0 0;line-height:1.5">Tal med t er dit selvstudie fra Selvstudie (på den dag, sessionen begyndte), tal uden t dine svar i Træning og På farten (${[f.kode && "drills", f.genkald && "genkald", f.eksamenstraening && "eksamensopgaver"].filter(Boolean).join(", ")}).</p>
  </section>`;
}

function render() {
  const f = S.fag.find(x => x.id === valgt) || S.fag[0];
  valgt = f.id;
  document.getElementById("tabs").innerHTML = S.fag.map(x => `<button type="button" role="tab" data-id="${x.id}" aria-pressed="${x.id === valgt}" aria-selected="${x.id === valgt}">${esc(x.kort)}</button>`).join("");
  document.getElementById("sub").textContent = `Uge ${visUge().uge} · aflæst fra mappen ${stamp(S.genereret)}`;
  const e = f.eksamen || {};
  const kommende = S.deadlines.filter(d => (d.fag === f.kort || d.fag === "Alle") && (d.til || d.fra) >= iso(new Date()) && d.type !== "ferie").slice(0, 3);
  document.getElementById("root").innerHTML = `
    <section class="card fag-head"><span class="sw" style="background:${f.farve}"></span><div>
      <h2>${esc(f.navn)}</h2>
      ${e.Eksamen ? `<p><b>Eksamen:</b> ${esc(e.Eksamen)}. <b>Det der virker:</b> ${esc((e["Det der virker"] || "").replace(/\*\*/g, ""))}.</p>` : ""}
      ${kommende.length ? `<p><b>Næste:</b> ${kommende.map(d => `${esc(udenHtml(d.hvad))} (${nedtaelling(d.dato || d.fra, !d.dato)})`).join(" · ")}</p>` : ""}
    </div></section>
    ${styrPaa(f)}
    ${f.usb_noter ? `<a class="card panel usb-kort" href="usb.html#${encodeURIComponent(f.id)}">
      <span class="ico">${icon("hard-drive", 18)}</span>
      <span><b>USB-noter</b><small>Fagnoterne, du tager med på USB til eksamen, uge for uge. Giv en uge en vurdering, så strammer Studie-rutinen den ind.</small></span>
      <span class="go">Åbn ${icon("arrow-right", 14)}</span></a>` : ""}
    ${rytme(f)}
    ${tiles(f)}
    ${plan(f)}
    ${detaljer(f)}
    ${f.status.aktivitet.length ? `<section class="card panel"><details><summary>Ændret de sidste 7 dage (${f.status.aktivitet.length})</summary>
      <ul class="files">${f.status.aktivitet.map(a => `<li><span>${esc(a.fil)}</span><span>${kort(a.ændret)}</span></li>`).join("")}</ul></details></section>` : ""}
  `;
  const gd = document.getElementById("guide");
  if (gd) gd.ontoggle = () => { guideAaben = gd.open; };
  const rd = document.getElementById("resume");
  if (rd) rd.ontoggle = () => { resumeAaben = rd.open; };
  const sel = document.getElementById("uge");
  if (sel) sel.onchange = () => { planUge = +sel.value; render(); };
  document.querySelectorAll(".nav-btn").forEach(b => b.onclick = () => {
    const ugr = [...sel.options].map(o => +o.value), j = ugr.indexOf(+sel.value) + +b.dataset.step;
    if (ugr[j] != null) { planUge = ugr[j]; render(); }
  });
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  valgt = b.dataset.id; history.replaceState(null, "", "#" + valgt); render();
});
window.addEventListener("hashchange", () => { valgt = location.hash.slice(1).split("/")[0]; planUge = hashUge() || planUge; if (S) render(); });
async function gemEgne() {
  const ta = document.getElementById("egne"), b = document.getElementById("egne-gem");
  if (!ta || !EO || b.disabled) return;
  const fag = valgt, uge = +ta.dataset.uge;
  b.disabled = true;
  try {
    const r = await fetch("/studie/api/egne-ord", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fag, uge, tekst: ta.value }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.fejl || r.status);
    (EO[fag] ||= {}); if (d.tekst) EO[fag][uge] = d.tekst; else delete EO[fag][uge];
    kladde.gem(ta.dataset.k, null);
    document.getElementById("egne-status").textContent = `· ${d.tekst ? "gemt" : "tom"}`;
  } catch (x) { alert(`Kunne ikke gemme: ${x.message}`); }
  finally { b.disabled = false; }
}
document.getElementById("root").addEventListener("input", e => {
  if (e.target.id !== "egne") return;
  const ta = e.target, uge = +ta.dataset.uge;
  kladde.gem(ta.dataset.k, ta.value);
  document.getElementById("egne-status").textContent = `· ${egneStatus(EO?.[valgt]?.[uge] || "", ta.value)}`;
});
document.getElementById("root").addEventListener("keydown", e => {
  if (e.target.id === "egne" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); gemEgne(); }
});
document.getElementById("root").addEventListener("click", async e => {
  if (e.target.closest("#egne-gem")) return gemEgne();
  const b = e.target.closest(".ugeknap"); if (!b) return;
  const uge = +b.dataset.uge, nu = b.getAttribute("aria-pressed") !== "true";
  b.disabled = true;
  try {
    const r = await fetch("/studie/api/laest", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fag: valgt, uge, laest: nu }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.fejl || r.status);
    (LAEST[valgt] ||= {}); if (d.laest) LAEST[valgt][uge] = d.laest; else delete LAEST[valgt][uge];
    render();
  } catch (x) { b.disabled = false; alert(`Kunne ikke gemme: ${x.message}`); }
});
fetch("/studie/api/egne-ord").then(r => r.ok ? r.json() : null).then(d => { EO = d; if (S) render(); }).catch(() => {});
fetch("fagnoter.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(d => { FN = d; if (S) render(); }).catch(() => {});
fetch("resumeer.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(d => { RS = d; if (S) render(); }).catch(() => {});
fetch("/studie/api/eksamen/uger", { cache: "no-store" }).then(r => r.ok ? r.json() : Promise.reject()).then(d => { EU = d; if (S) render(); }).catch(() => { EU = false; if (S) render(); });
// Styr på hentes live. Svarer serveren ikke (eller med en fejl), står det i kortets plads, så du ved, hvor Styr på er
const jsonEllerFejl = r => r.json().catch(() => ({})).then(d => { if (!r.ok) throw new Error(d.fejl || `svarede ${r.status}`); return d; });
Promise.all([fetch("/studie/api/laest").then(jsonEllerFejl), fetch("/studie/api/genkald").then(jsonEllerFejl)])
  .then(([l, g]) => { LAEST = l; GK = Array.isArray(g) ? g : []; STYR_FEJL = null; if (S) render(); })
  .catch(e => { STYR_FEJL = e.message; if (S) render(); });
// Samme uge som Ugeoverblik (visUge i studie.js: weekenden hører til næste uge). Er dens køreplan ikke skrevet endnu,
// viser plan() sidste uges med et mærke (koereplan i studie.js) eller ellers den aktuelle
loadStudie().then(d => { S = d; planUge = hashUge() || visUge().uge; render(); },
  e => { document.getElementById("root").innerHTML = `<div class="card empty">${esc(e.message)}. Kør <code>node Scripts/kompas-eksport.js</code> i semestermappen.</div>`; });
</script>

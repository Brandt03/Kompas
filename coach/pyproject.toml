[project]
name = "garmin-coach"
version = "0.1.0"
description = "Lokal MCP-server der giver Claude adgang til dine Garmin- og kalenderdata"
requires-python = ">=3.11"
dependencies = [
    # 2.x kræves: FastMCP hed noget andet i 1.x og API'et er ikke kompatibelt
    "mcp[cli]>=2.0.0",
    "garminconnect>=0.3.0",
    "icalendar>=6.0.0",
    "recurring-ical-events>=3.0.0",
]

[project.scripts]
garmin-coach = "garmin_coach.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["garmin_coach"]

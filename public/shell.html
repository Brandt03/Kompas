<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kompas</title>
<script>
  // "/" is always this page; Sure's own overview lives at /okonomi. When Sure sends the frame to "/"
  // (after login, its logo), show its overview instead of the portal inside itself.
  if (window.top !== window) location.replace("/okonomi" + location.search);
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0b'/%3E%3Cpath d='M19 25v-6.5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1V25M8 14.5a2 2 0 0 1 .7-1.5l6-5.1a2 2 0 0 1 2.6 0l6 5.1a2 2 0 0 1 .7 1.5V23a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/kompas/assets/tokens.css">
<style>
  :root { --side-w: 248px; }
  html, body { height: 100%; }
  body { display: flex; overflow: hidden; }

  /* sidebar */
  .side {
    width: var(--side-w); flex: none; height: 100dvh; display: flex; flex-direction: column;
    border-right: 1px solid var(--divider); background: var(--surface);
  }
  .brand-row { display: flex; align-items: center; padding-right: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; text-decoration: none; color: var(--text-primary); }
  .mark { width: 32px; height: 32px; border-radius: 9px; background: var(--nav-indicator); color: var(--surface); display: grid; place-items: center; flex: none; }
  .brand b { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .brand small { display: block; color: var(--text-secondary); font-size: 12px; font-weight: 400; }

  nav.groups { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
  .group + .group { margin-top: 14px; }
  .group ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  /* Områderne klapper sammen; det åbne står som en mappe med sine sider indrykket under sig */
  .group + .group[data-label] { margin-top: 2px; }
  .group:first-child + .group[data-label] { margin-top: 12px; }
  /* Et område med kun én side er ikke en mappe, men ét punkt med områdets navn */
  .group + .group[data-enkelt] { margin-top: 2px; }
  .group:first-child + .group[data-enkelt] { margin-top: 12px; }
  .group-head { color: var(--text-primary); font-weight: 500; }
  .group-head > span { flex: 1; }
  .group-head .chev { color: var(--text-subdued); transition: transform .15s ease; }
  .group[data-open] .group-head .chev { transform: rotate(90deg); }
  .group[data-label] ul { display: none; margin: 2px 0 6px 17px; padding-left: 6px; border-left: 1px solid var(--divider); }
  .group[data-label][data-open] ul { display: flex; }
  .group[data-label] .item[aria-current="page"]::before { left: -8px; width: 3px; }
  /* Et lukket område med nyt indhold får prikken på mappen */
  .group-head .dot { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--text-primary); flex: none; }
  .group:not([data-open]) .group-head[data-nyt] .dot { display: block; }

  /* Gå til: søg på tværs af alle sider */
  .find { position: relative; margin: 0 0 10px; }
  .find .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-subdued); pointer-events: none; }
  .find input {
    width: 100%; box-sizing: border-box; padding: 7px 44px 7px 32px; border-radius: 8px; border: 0; font: inherit; font-size: 13.5px;
    background: var(--surface-inset); color: var(--text-primary); outline: none;
  }
  .find input::placeholder { color: var(--text-subdued); }
  .find input:focus { box-shadow: 0 0 0 2px var(--nav-indicator); }
  .find kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: inherit; font-size: 11px;
    color: var(--text-subdued); pointer-events: none;
  }
  .find input:focus ~ kbd, .find input:not(:placeholder-shown) ~ kbd { display: none; }
  #hits ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .hit-group { margin-left: auto; font-size: 12px; color: var(--text-subdued); white-space: nowrap; }
  #hits .item[data-nyt]::after { margin-left: 0; }
  .none { margin: 6px 10px; font-size: 13px; color: var(--text-subdued); }
  .item:focus-visible { outline: 2px solid var(--nav-indicator); outline-offset: -2px; }
  @media (hover: none) { .find kbd { display: none; } }

  .item {
    position: relative; display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 7px 10px; border-radius: 8px; border: 0; background: none; font: inherit; font-size: 14px;
    color: var(--text-secondary); text-decoration: none; cursor: pointer; text-align: left;
  }
  .item .ic { flex: none; }
  .item:hover { background: var(--surface-hover); color: var(--text-primary); }
  .item[aria-current="page"] { background: var(--container); color: var(--text-primary); font-weight: 500; box-shadow: var(--shadow-border-xs); }
  .item[aria-current="page"]::before {
    content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 4px;
    border-radius: 0 3px 3px 0; background: var(--nav-indicator);
  }
  /* Nyt indhold, du ikke har åbnet endnu ("nyt" i projektets kompas.json) */
  a.item[data-nyt]::after, #open[data-nyt]::after {
    content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--text-primary); flex: none;
  }
  a.item[data-nyt]::after { margin-left: auto; }
  #open[data-nyt] { position: relative; }
  #open[data-nyt]::after { position: absolute; top: 7px; right: 7px; box-shadow: 0 0 0 2px var(--surface); }
  .item[aria-disabled="true"] { color: var(--text-subdued); cursor: default; }
  .item[aria-disabled="true"]:hover { background: none; color: var(--text-subdued); }
  .pill {
    margin-left: auto; font-size: 11px; font-weight: 500; line-height: 1; padding: 3px 6px; border-radius: 999px;
    background: var(--surface-inset); color: var(--text-subdued);
  }

  .foot { border-top: 1px solid var(--divider); padding: 10px; display: flex; flex-direction: column; gap: 2px; }
  .status { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--text-secondary); }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--gray-400); flex: none; }
  .status.up i { background: var(--success); }
  .status.down i { background: var(--warning); }
  .status[hidden] { display: none; }

  /* content */
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100dvh; }
  .topbar { display: none; }
  iframe { flex: 1; width: 100%; border: 0; display: block; background: var(--surface); }

  .scrim { display: none; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; border: 0;
    background: none; color: var(--text-secondary); cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
  .close-btn { display: none; margin-left: auto; }
  /* Trykskærm: menupunkter, mapper, Gå til og knapperne er mindst 44 px (som page.css' regel for siderne) */
  @media (hover: none) and (pointer: coarse) {
    .item { min-height: 44px; }
    .icon-btn { width: 44px; height: 44px; flex: none; }
    .find input { min-height: 44px; }
  }

  @media (max-width: 899px) {
    .side {
      position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(300px, 86vw);
      transform: translateX(-100%); transition: transform .2s ease; box-shadow: 0 10px 40px rgba(0,0,0,.18);
    }
    body.open .side { transform: none; }
    body.open .scrim { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.3); }
    .close-btn { display: inline-grid; }
    .topbar {
      display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 6px;
      padding-top: calc(env(safe-area-inset-top) + 8px); border-bottom: 1px solid var(--divider); background: var(--surface);
    }
    .topbar b { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }

  /* Timer: knappen under Frister, menuen ved siden af og tælleren øverst over siden */
  .timer-tid { margin-left: auto; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--text-primary); }
  .item.timer-koerer { color: var(--text-primary); }
  .tm-pop {
    position: fixed; z-index: 40; width: 300px; max-width: calc(100vw - 24px); padding: 12px; border-radius: 14px;
    background: var(--container); box-shadow: var(--shadow-border-xs), 0 12px 40px rgba(0,0,0,.22); font-size: 13.5px; color: var(--text-primary);
  }
  .tm-pop[hidden], .tm-pille[hidden] { display: none; }
  .tm-pop h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .tm-pop .lbl { font-size: 12px; color: var(--text-secondary); margin: 10px 0 4px; }
  .tm-seg { display: flex; background: var(--surface-inset); border-radius: 10px; padding: 3px; gap: 2px; }
  .tm-seg button { flex: 1; border: 0; background: none; font: inherit; font-size: 13px; color: var(--text-secondary); padding: 6px 8px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .tm-seg button[aria-pressed="true"] { background: var(--container); color: var(--text-primary); font-weight: 500; box-shadow: var(--shadow-border-xs); }
  .tm-seg button.tm-pm { flex: none; width: 30px; }
  .tm-to { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tm-to .tm-seg span { flex: 1; text-align: center; align-self: center; font-variant-numeric: tabular-nums; }
  .tm-fag { list-style: none; margin: 12px 0 0; padding: 10px 0 0; border-top: 1px solid var(--divider); display: grid; gap: 2px; }
  .tm-fag button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; font: inherit; font-size: 14px; color: var(--text-primary);
    padding: 7px 8px; border-radius: 8px; cursor: pointer; text-align: left; }
  .tm-fag button:hover { background: var(--surface-hover); }
  .tm-fag .ic { margin-left: auto; color: var(--text-secondary); }
  .tm-sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .tm-knapper { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .tm-knap { display: inline-flex; align-items: center; gap: 6px; border: 0; font: inherit; font-size: 13.5px; font-weight: 500; padding: 8px 12px; border-radius: 9px; cursor: pointer;
    background: var(--nav-indicator); color: var(--container); }
  .tm-knap.ghost { background: var(--container); color: var(--text-primary); box-shadow: var(--shadow-border-xs); }
  .tm-knap.quiet { background: none; color: var(--text-secondary); padding: 8px 6px; }
  .tm-knap:hover { opacity: .88; }
  .tm-pop select, .tm-pop input { font: inherit; font-size: 13px; color: var(--text-primary); background: var(--container); border: 0; box-shadow: var(--shadow-border-xs); border-radius: 8px; padding: 6px 8px; }
  .tm-advar { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: var(--warning-tint); font-size: 12.5px; display: grid; gap: 6px; }
  .tm-fejl { color: var(--destructive); font-size: 12.5px; margin-top: 8px; }
  .tm-link { display: inline-block; margin-top: 10px; color: var(--text-secondary); font-size: 12.5px; }
  .tm-pille {
    position: fixed; z-index: 15; top: 10px; left: calc(var(--side-w) + (100vw - var(--side-w)) / 2); transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 5px; border-radius: 999px; font-size: 14px; white-space: nowrap;
    background: var(--container); box-shadow: var(--shadow-border-xs), 0 6px 24px rgba(0,0,0,.18); color: var(--text-primary);
  }
  .tm-pille.tm-skift { animation: tm-skift 1.6s ease-out 2; }
  @keyframes tm-skift { 0% { box-shadow: var(--shadow-border-xs), 0 6px 24px rgba(0,0,0,.18), 0 0 0 0 var(--nav-indicator); }
    30% { box-shadow: var(--shadow-border-xs), 0 6px 24px rgba(0,0,0,.18), 0 0 0 6px color-mix(in srgb, var(--nav-indicator) 35%, transparent); }
    100% { box-shadow: var(--shadow-border-xs), 0 6px 24px rgba(0,0,0,.18), 0 0 0 14px transparent; } }
  .tm-pille .tm-stor { width: 32px; height: 32px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: var(--nav-indicator); color: var(--container); }
  .tm-pille .tm-lys { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex: none; }
  .tm-pille .tm-lys.pause { background: var(--warning); }
  .tm-pille b { font-variant-numeric: tabular-nums; font-weight: 600; padding-left: 8px; border-left: 1px solid var(--divider); }
  .tm-pille .icon-btn { width: 30px; height: 30px; }
  @media (max-width: 899px) { .tm-pille { left: 50%; top: calc(env(safe-area-inset-top) + 58px); } }
  .group[data-timer] { margin-top: 1px !important; }
  .group[data-timer] li { position: relative; }
  .timer-hurtig { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; }
  .timer-hurtig[hidden] { display: none; }
  /* Gem session: når du stopper timeren */
  .tm-dialog { width: min(440px, calc(100vw - 24px)); padding: 18px; border: 0; border-radius: 16px; background: var(--container); color: var(--text-primary);
    box-shadow: var(--shadow-border-xs), 0 20px 60px rgba(0,0,0,.3); font-size: 14px; }
  .tm-dialog::backdrop { background: rgba(0,0,0,.35); }
  .tm-dialog .hoved { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .tm-dialog h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .tm-dialog .kasser { border: 0; background: none; font: inherit; font-size: 13px; color: var(--destructive); cursor: pointer; padding: 4px; }
  .tm-felter { display: grid; gap: 8px; }
  .tm-raekke { display: grid; gap: 8px; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); }
  .tm-felt { display: grid; gap: 3px; padding: 8px 10px; border-radius: 10px; background: var(--surface-inset); font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .tm-felt input, .tm-felt select, .tm-felt textarea { font: inherit; font-size: 14.5px; font-weight: 400; color: var(--text-primary); background: none; border: 0; padding: 0; outline: none; width: 100%; min-width: 0; }
  .tm-felt textarea { min-height: 64px; resize: vertical; }
  .tm-felt:focus-within { box-shadow: 0 0 0 2px var(--nav-indicator); }
  .tm-obs { font-size: 12.5px; color: var(--text-secondary); display: flex; gap: 8px; align-items: center; }
  .tm-obs[hidden] { display: none; }
  .tm-obs b { background: var(--destructive-tint); color: var(--destructive); border-radius: 6px; padding: 2px 6px; font-size: 11.5px; letter-spacing: .03em; }
  .tm-dialog .knapper { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .tm-dialog .knapper .tm-knap { justify-content: center; padding: 11px; }
  .group[data-timer] + .group[data-label], .group[data-timer] + .group[data-enkelt] { margin-top: 12px; }
</style>
</head>
<body>
  <aside class="side" id="side" aria-label="Hovedmenu">
    <div class="brand-row">
      <a class="brand" href="#/kompas/">
        <span class="mark" id="mark"></span>
        <span><b>Kompas</b><small>Økonomi, studie, sprog, form og skærmtid</small></span>
      </a>
      <button class="icon-btn close-btn" id="close" type="button" aria-label="Luk menu"></button>
    </div>
    <nav class="groups" id="nav">
      <div class="find" id="find-row">
        <input id="find" type="search" placeholder="Gå til …" aria-label="Gå til side" autocomplete="off" spellcheck="false">
        <kbd id="find-kbd">⌘K</kbd>
      </div>
      <div id="hits" hidden></div>
      <div id="tree"></div>
    </nav>
    <div class="foot">
      <a class="item" id="forbindelser" href="#/kompas/forbindelser.html" data-src="/kompas/forbindelser.html"></a>
      <div class="status down" id="kopi-status" role="status" hidden><i></i><span></span></div>
      <div class="status" id="sure-status" role="status"><i></i><span>Tjekker Sure …</span></div>
      <a class="item" id="newtab" href="/" target="_blank" rel="noopener"></a>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="content">
    <div class="topbar">
      <button class="icon-btn" id="open" type="button" aria-label="Åbn menu"></button>
      <b id="top-title">Kompas</b>
      <button class="icon-btn" id="reload" type="button" aria-label="Genindlæs siden"></button>
    </div>
    <iframe id="frame" title="Indhold" allow="publickey-credentials-get; publickey-credentials-create; clipboard-write"></iframe>
  </div>

  <div class="tm-pop" id="timer-pop" role="dialog" aria-label="Timer" hidden></div>
  <div class="tm-pille" id="timer-pille" role="status" aria-label="Timeren kører" hidden></div>
  <dialog class="tm-dialog" id="timer-gem" aria-labelledby="timer-gem-titel"></dialog>

<script src="/kompas/assets/icons.js"></script>
<script>
// Kompas owns only "Kompas". Every other group comes from the projects themselves: each writes a kompas.json
// next to its pages, listed in projekter.json:
//   { omraade, ikon, raekkefoelge, kilde, opdateret, sider: [{ titel, ikon, sti, match?, praecis?, fane?, nyt? }] }
// `match` lists the path prefixes that count as "this page" when you click around inside it (Sure navigates
// on its own); `praecis` means only the exact path; `fane` is the id of a tab inside the page that shows this
// view, for projects with several views on one page. A page without `sti` is planned ("snart").
// `oeverst` puts a page in the top group, under I dag, while the project still owns it.
// `nyt` is a key for the page's newest content (a new weekly review, a new plan). When it changes, the menu
// shows a dot until the page is opened. Which key you last saw is remembered in this browser only.
// An area with only one page is no folder: it shows as one item with the area's name and icon.
// Several projects can name the same omraade; their pages then share that folder.
const HOME = "/kompas/";
const ØVERST = [{ label: "I dag", icon: "sun", src: HOME }];
// Forbindelser står i bunden af menuen over Sures status, men findes stadig under Gå til
const BUND = { items: [{ label: "Forbindelser", icon: "plug", src: "/kompas/forbindelser.html" }] };
let NAV = [{ items: [...ØVERST] }];
let PAGES = [...NAV[0].items, ...BUND.items];

const $ = id => document.getElementById(id);
const frame = $("frame");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

$("mark").innerHTML = icon("compass", 18);
$("open").innerHTML = icon("menu", 20);
$("close").innerHTML = icon("x", 18);
$("reload").innerHTML = icon("rotate-cw", 18);
$("forbindelser").innerHTML = `${icon("plug")}<span>Forbindelser</span>`;
$("newtab").innerHTML = `${icon("external-link")}<span>Åbn siden i ny fane</span>`;
$("find-row").insertAdjacentHTML("afterbegin", icon("search", 15));
if (!/Mac|iPhone|iPad/.test(navigator.platform)) $("find-kbd").textContent = "Ctrl K";

async function loadNav() {
  let list = [];
  try { list = (await (await fetch("/kompas/projekter.json", { cache: "no-store" })).json()).manifester || []; } catch (e) {}
  const groups = await Promise.all(list.map(async url => {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(`svarede ${r.status}`);
      const m = await r.json();
      return { label: m.omraade, icon: m.ikon, order: m.raekkefoelge ?? 50, kilde: m.kilde, opdateret: m.opdateret,
        items: (m.sider || []).map(p => ({ label: p.titel, icon: p.ikon, src: p.sti, match: p.match, exact: p.praecis, fane: p.fane, nyt: p.nyt, snart: !p.sti, oeverst: !!p.oeverst && !!p.sti })) };
    } catch (e) {
      return { label: url.split("/")[1], order: 99, fejl: `${url} ${e.message}`, items: [] };
    }
  }));
  // Projects with the same omraade share one folder: the one with the lowest raekkefoelge gives the icon and the
  // place, and the others' pages follow its own
  const merged = [];
  for (const g of groups.sort((a, b) => a.order - b.order)) {
    const first = !g.fejl && merged.find(x => !x.fejl && x.label === g.label);
    if (first) first.items.push(...g.items); else merged.push(g);
  }
  // Sider med `oeverst` står i den øverste gruppe, efter I dag (fx Studies Frister), men hører stadig til
  // projektet; et område, der kun havde dem, forsvinder ikke, så længe det har andre sider
  const op = merged.flatMap(g => g.items.filter(p => p.oeverst));
  for (const g of merged) g.items = g.items.filter(p => !p.oeverst);
  NAV = [{ items: [...ØVERST, ...op] }, ...merged.filter(g => g.fejl || g.items.length)];
  PAGES = [...NAV, BUND].flatMap(g => g.items).filter(p => p.src);
  renderNav();
  husk();
}

// --- new content ---------------------------------------------------------------------------------
const SET_NØGLE = "kompas-set";
let SET = {};
const gemSet = () => { try { localStorage.setItem(SET_NØGLE, JSON.stringify(SET)); } catch (e) {} };
// The first time (or a page that's new in the menu) counts as seen, so the menu doesn't light up all at once
function husk() {
  let gemt = null;
  try { gemt = JSON.parse(localStorage.getItem(SET_NØGLE)); } catch (e) {}
  SET = gemt || {};
  for (const p of PAGES) if (p.nyt && !(p.src in SET)) SET[p.src] = p.nyt;
  gemSet();
}
function prikker() {
  let nogen = false;
  document.querySelectorAll("#nav a.item").forEach(a => {
    const p = PAGES.find(x => x.src === a.dataset.src), ny = !!(p?.nyt && SET[p.src] !== p.nyt);
    nogen ||= ny;

const pathOf = src => src.split("#")[0].split("?")[0];

function pageFor(path) {
  const clean = path.split("#")[0], pathname = pathOf(path);
  const views = fanePages(pathname);
  if (views.length) return views.find(p => p.src === clean) || views[0];
  let best = null, bestLen = -1;
  for (const p of PAGES) {
    for (const m of p.match || [pathOf(p.src)]) {
      const hit = p.exact || m === "/" ? pathname === m : (pathname === m || pathname.startsWith(m.endsWith("/") ? m : m + "/"));
      if (hit && m.length > bestLen) { best = p; bestLen = m.length; }
    }
  }
  return best;
}

// --- frame navigation --------------------------------------------------------------------------
const wanted = () => decodeURIComponent(location.hash.slice(1)) || HOME;

// A page with views ("fane") is addressed by the view that is selected inside it
function selectedView(pathname) {
  try {
    const d = frame.contentDocument;
    return fanePages(pathname).find(p => d.getElementById(p.fane)?.getAttribute("aria-selected") === "true") || null;
  } catch (e) { return null; }
}

  try { frame.contentDocument.getElementById(page.fane)?.click(); } catch (e) {}
}

function framePath() {
  try {
    const l = frame.contentWindow.location;
    if (l.href === "about:blank") return null;
    const view = selectedView(l.pathname);
    if (view) return view.src;
    // Turbo can leave Sure's overview on "/"; its real address here is /okonomi
    return (l.pathname === "/" ? "/okonomi" : l.pathname) + l.search + l.hash;
  } catch (e) { return null; }
}

function go(path) {
  path = path || HOME;
  if (!path.startsWith("/")) path = HOME;
  const cur = framePath();
  if (cur === path) { mark(path); return; }
  // Another view of the page already showing: switch it in place instead of reloading
  const page = pageFor(path);
  if (cur && page?.fane && pathOf(cur) === pathOf(path)) { showView(page); sync(); return; }
  frame.src = path;
  mark(path);
}

// Keep the address bar and menu in step with whatever the frame shows, without adding history entries
// (the frame's own history already covers the back button).
function sync(set = true) {
  const p = framePath();
  if (!p) return;
  if (wanted() !== p) history.replaceState(null, "", "#" + p);
  mark(p, set);
}

function injectSureStyle(doc) {

    if (asked) showView(asked);

// --- Timer: Studies stopur (Selvstudie) på alle sider ------------------------------------------------
// Studie-serveren holder stopuret (/studie/api/stopur), så det kan startes på Mac'en og stoppes på bærbaren; rammen
// henter det hvert halve minut og tæller selv sekunderne imellem. Knappen under Frister åbner timeren (stopur eller
// Pomodoro, og fagene); mens den kører, står en tæller øverst over siden, og fanens titel tæller med. Svarer
// Studie-serveren ikke (fx bærbarens kopi), er der ingen timer. Valgene (stopur eller Pomodoro, længde, antal, pause)
// huskes i denne browser.
const TIMER_API = "/studie/api/stopur", LANG_T = 3;

const gemValg = () => { try { localStorage.setItem("kompas-timer", JSON.stringify(VALG)); } catch (e) {} };
const ms = s => Date.parse(s), to2 = n => String(n).padStart(2, "0");
// Som slutFor i Studies Scripts/sessioner.js: et åbent stykke slutter nu, med Pomodoro højst arbejde-minutter efter starten
const stykkeSlut = (st, p, nu) => st[1] ? ms(st[1]) : p ? Math.min(nu, ms(st[0]) + p.arbejde * 6e4) : nu;
const arbejdet = (g, nu) => g.stykker.reduce((a, st) => a + Math.max(0, stykkeSlut(st, g.pomodoro, nu) - ms(st[0])), 0);
const urTxt = t => { const s = Math.max(0, Math.round(t / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}:${to2(m)}:${to2(s % 60)}` : `${to2(m)}:${to2(s % 60)}`; };
const klok = t => { const d = new Date(t); return `${to2(d.getHours())}:${to2(d.getMinutes())}`; };
// koerer (stopur), fokus (Pomodoro), pause (du trykkede pause), pomopause (Pomodoros pause), klar (pausen er slut) eller
// faerdig (alle Pomodoros er taget)
function tTilstand(g, nu) {
  const st = g.stykker.at(-1), p = g.pomodoro;
  if (!st[1] && (!p || ms(st[0]) + p.arbejde * 6e4 > nu)) return { navn: p ? "fokus" : "koerer", tilbage: p ? ms(st[0]) + p.arbejde * 6e4 - nu : null, fra: ms(st[0]) };
  const slut = stykkeSlut(st, p, nu);
  if (p && slut - ms(st[0]) >= p.arbejde * 6e4 - 1000) {
    if (p.antal && g.stykker.length >= p.antal) return { navn: "faerdig", siden: slut };
    const tilbage = slut + p.pause * 6e4 - nu;
    return tilbage > 0 ? { navn: "pomopause", tilbage, siden: slut } : { navn: "klar", siden: slut };
  }
  return { navn: "pause", siden: slut };
}
const fagAf = id => SU?.fag.find(f => f.id === id) || { kort: id, farve: "var(--gray-400)" };

async function timerKald(krop) {

      <a class="tm-link" href="#/studie/selvstudie.html" data-luk>Selvstudie: sessioner, forslag og tilføj bagefter</a>`;
  } else {
    const ts = tTilstand(g, nu), f = fagAf(g.fag), kører = ts.navn === "koerer" || ts.navn === "fokus";
    const navn = { koerer: "Kører", fokus: `Fokus ${g.stykker.length}${g.pomodoro?.antal ? ` af ${g.pomodoro.antal}` : ""} · ${g.pomodoro?.arbejde} min`, pause: `Pause siden ${klok(ts.siden)}`,
      pomopause: `Pause · ${g.pomodoro?.pause} min`, klar: "Klar til næste fokus", faerdig: "Alle Pomodoros er taget" }[ts.navn];
    pop.innerHTML = `<h3><span class="tm-sw" style="background:${f.farve}"></span>${esc(f.kort)}<span style="font-weight:400;color:var(--text-secondary)">· ${esc(navn)}</span></h3>
      <div style="font-size:26px;font-weight:600;font-variant-numeric:tabular-nums" id="timer-pop-ur"></div>
      <div style="color:var(--text-secondary);font-size:12.5px">startet ${klok(ms(g.stykker[0][0]))}</div>
      <div class="tm-knapper">${kører ? `<button class="tm-knap ghost" type="button" data-h="pause">${icon("pause", 14)}Pause</button>`
          : ts.navn === "faerdig" ? "" : `<button class="tm-knap" type="button" data-h="fortsaet">${icon("play", 14)}${ts.navn === "pause" ? "Fortsæt" : "Næste fokus"}</button>`}
        <button class="tm-knap${kører || ts.navn === "faerdig" ? "" : " ghost"}" type="button" data-h="stop">${icon("square", 13)}Stop og gem</button></div>
      ${langt(g, ts, nu) ? `<div class="tm-advar">Det har kørt siden ${klok(ts.fra)}. Glemte du at stoppe? Stop og ret sluttiden, når du gemmer.</div>` : ""}
      <div class="tm-knapper"><label style="color:var(--text-secondary);font-size:12.5px">Fag <select id="timer-skift">${SU.fag.map(x => `<option value="${esc(x.id)}"${x.id === g.fag ? " selected" : ""}>${esc(x.kort)}</option>`).join("")}</select></label>
        <button class="tm-knap quiet" type="button" data-h="annuller">Kassér</button></div>
      ${TM_FEJL ? `<div class="tm-fejl">${esc(TM_FEJL)}</div>` : ""}
      <a class="tm-link" href="#/studie/selvstudie.html" data-luk>Åbn Selvstudie</a>`;
  }
}
// Hvert sekund: tallene, fanens titel og, når tilstanden skifter (fx et fokus, der er slut), resten
function tikTimer() {
  const g = SU?.igang;
  if (!g) { document.title = TITEL; $("timer-tid") && ($("timer-tid").textContent = ""); return; }
  const nu = Date.now(), ts = tTilstand(g, nu), nøgle = `${g.id}:${ts.navn}:${g.stykker.length}:${g.fag}:${langt(g, ts, nu)}`;
  if (nøgle !== TIMER_VIST) { const før = TIMER_VIST; visTimer(true); if (g.pomodoro && før?.startsWith(g.id)) signal(ts.navn, g); return; }
  const ur = ts.navn === "faerdig" ? urTxt(arbejdet(g, nu)) : urTxt(ts.tilbage ?? (ts.navn === "klar" ? 0 : arbejdet(g, nu)));
  const kort = fagAf(g.fag).kort;
  const tegn = { koerer: "⏱", fokus: "🍅", pause: "⏸", pomopause: "☕", klar: "🍅", faerdig: "✅" }[ts.navn];
  document.title = ts.navn === "pomopause" ? `${tegn} ${ur} | Pause` : ts.navn === "klar" ? `${tegn} Klar | ${kort}` : ts.navn === "faerdig" ? `${tegn} Færdig | ${kort}` : `${tegn} ${ur} | ${kort}`;
  for (const id of ["timer-tid", "timer-pille-ur", "timer-pop-ur"]) if ($(id)) $(id).textContent = ts.navn === "klar" ? "Klar" : ur;
}
// Pomodoro: en klokke, et pust på tælleren øverst og en notifikation, når et fokus eller en pause er slut.
// Pausen: tre toner, der falder roligt og klinger længe ud (pust ud). Klar til fokus: tre hurtige, lyse toner op.
// Alle Pomodoros taget: en brudt akkord op, der bliver hængende. Tonerne er C-dur fra C6, hvor små højttalere spiller kraftigst
const KLOKKE = {
  pomopause: { toner: [1568, 1319, 1047], afstand: 0.34, hale: 2.4 },
  klar: { toner: [1047, 1568, 2093], afstand: 0.12, hale: 1.3 },
  faerdig: { toner: [1047, 1319, 1568, 2093], afstand: 0.11, hale: 2.8, styrke: 0.8 },
};
// Hver tone er en lille klokke: grundtonen med en svagt forstemt tvilling (varme) og to overtoner, der klinger hurtigere ud.
// Et kort ekko giver rum, og en kompressor til sidst holder det rent, når tonerne overlapper
function klokke({ toner, afstand, hale, styrke: alt = 1 }) {
  if (!LYD) return;
  if (LYD.state === "suspended") LYD.resume().catch(() => {});
  const t0 = LYD.currentTime + 0.05, ud = LYD.createDynamicsCompressor(), ind = LYD.createGain();
  ud.threshold.value = -10; ud.ratio.value = 8; ud.attack.value = 0.002; ind.gain.value = 0.75 * alt; ud.connect(LYD.destination); ind.connect(ud);
  const ekko = LYD.createDelay(1), tilbage = LYD.createGain(), dæmp = LYD.createBiquadFilter(), vaad = LYD.createGain();
  ekko.delayTime.value = 0.19; tilbage.gain.value = 0.3; dæmp.type = "lowpass"; dæmp.frequency.value = 2500; vaad.gain.value = 0.35;
  ind.connect(ekko); ekko.connect(dæmp); dæmp.connect(tilbage); tilbage.connect(ekko); dæmp.connect(vaad); vaad.connect(ud);
  toner.forEach((f, i) => {
    const t = t0 + i * afstand;
    for (const [frek, styrke, klang] of [[f, 0.5, 1], [f * 1.003, 0.2, 1], [f * 2, 0.12, 0.5], [f * 3, 0.04, 0.25]]) {
      const o = LYD.createOscillator(), v = LYD.createGain();
      o.type = "sine"; o.frequency.value = frek; o.connect(v); v.connect(ind);
      v.gain.setValueAtTime(0.0001, t); v.gain.linearRampToValueAtTime(styrke, t + 0.012); v.gain.exponentialRampToValueAtTime(0.0001, t + hale * klang);
      o.start(t); o.stop(t + hale * klang + 0.05);
    }
  });
}
function signal(navn, g) {
  const tekst = { pomopause: `Fokus slut: ${g.pomodoro.pause} min pause`, klar: "Pausen er slut", faerdig: "Alle Pomodoros er taget" }[navn];
  if (!tekst) return;
  try { klokke(KLOKKE[navn]); } catch (e) {}
  const pille = $("timer-pille"); pille.classList.remove("tm-skift"); void pille.offsetWidth; pille.classList.add("tm-skift");
  try { if (Notification.permission === "granted") new Notification(tekst, { body: `${fagAf(g.fag).kort} · Selvstudie`, tag: "pomodoro", silent: true }); } catch (e) {}
}
// Browseren spiller først lyd efter et klik; det første klik eller tastetryk på en side låser den op, også efter en genindlæsning
const lasOpLyd = () => { try { LYD ||= new AudioContext(); if (LYD.state === "suspended") LYD.resume(); } catch (e) {} };
document.addEventListener("pointerdown", lasOpLyd, { capture: true });
document.addEventListener("keydown", lasOpLyd, { capture: true });

function aabnTimer(vis) {
  const pop = $("timer-pop"), knap = $("timer-knap");
  pop.hidden = !vis;
  knap?.setAttribute("aria-expanded", String(vis));
  if (!vis) return;
  TM_FEJL = null; tegnPop(); tikTimer();
  // Ved siden af knappen; på en smal skærm øverst på siden
  if (SMAL.matches || !knap) { pop.style.left = "12px"; pop.style.top = "60px"; }
  else { const r = knap.getBoundingClientRect(); pop.style.left = `${r.right + 8}px`; pop.style.top = `${Math.max(8, Math.min(r.top - 8, innerHeight - pop.offsetHeight - 8))}px`; }
  hentTimer();
}
document.addEventListener("click", e => {
  // Quickstart: det sidste fag med dine sidste valg, uden at åbne timeren
  if (e.target.closest("#timer-hurtig")) {
    const fag = hurtigFag(), pomo = VALG.slags === "pomodoro";
    return timerHandling({ handling: "start", fag: fag.id, pomodoro: pomo ? { arbejde: VALG.arbejde, antal: VALG.antal, pause: VALG.pause } : false });
  }
  const knap = e.target.closest("#timer-knap, [data-aabn]");
  if (knap) { e.preventDefault(); aabnTimer($("timer-pop").hidden); return; }
  const inde = e.target.closest("#timer-pop, #timer-pille");
  if (!inde) { if (!$("timer-pop").hidden) aabnTimer(false); return; }
  if (e.target.closest("[data-luk]")) { aabnTimer(false); document.body.classList.remove("open"); return; }
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.valg) {
    const k = b.dataset.valg, GR = { arbejde: [5, 180], antal: [1, 12], pause: [1, 60] };
    if (k === "slags") VALG.slags = b.dataset.v;
    else VALG[k] = Math.max(GR[k][0], Math.min(GR[k][1], b.dataset.v ? +b.dataset.v : VALG[k] + +b.dataset.d));
    gemValg(); tegnPop(); return;
  }
  // Pomodoro beder om lov til notifikationer første gang
  if (b.dataset.start) {
    const pomo = VALG.slags === "pomodoro";
    VALG.fag = b.dataset.start; gemValg();
    if (pomo && "Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
    aabnTimer(false);
    return timerHandling({ handling: "start", fag: b.dataset.start, pomodoro: pomo ? { arbejde: VALG.arbejde, antal: VALG.antal, pause: VALG.pause } : false });
  }
  const h = b.dataset.h; if (!h) return;
  if (h === "annuller" && !confirm("Kassér sessionen? Den bliver ikke gemt.")) return;
  if (h === "stop" || h === "annuller") aabnTimer(false);
  if (h === "stop") return aabnGem();
  timerHandling({ handling: h });
});
document.addEventListener("change", e => { if (e.target.id === "timer-skift") timerHandling({ handling: "skift", fag: e.target.value }); });
// Gem session: Stop åbner en formular med datoen, starten, slutningen og pausen fra timeren, som du kan rette, og faget,
// en aktivitet og en note. Annullér lader timeren køre videre; tiden, mens formularen er åben, tæller ikke. Kun det, du
// har ændret, sendes; resten tager serveren fra timeren.
let GEM = null;
const datoTxt = d => `${d.getFullYear()}-${to2(d.getMonth() + 1)}-${to2(d.getDate())}`;
function aabnGem() {
  const g = SU?.igang; if (!g) return;
  const nu = Date.now(), start = ms(g.stykker[0][0]), slut = Math.max(...g.stykker.map(st => stykkeSlut(st, g.pomodoro, nu)));
  const pause = Math.round((slut - start - arbejdet(g, nu)) / 6e4), sd = new Date(start);
  GEM = { start, slut, pause, dato: datoTxt(sd), fra: klok(start), til: klok(slut) };
  const el = $("timer-gem"), aktiv = SU.aktiviteter || [];
  el.innerHTML = `<form method="dialog" id="timer-gem-form">
    <div class="hoved"><h2 id="timer-gem-titel">Gem session</h2><button type="button" class="kasser" data-gem="kasser">Kassér timer</button></div>
    <div class="tm-felter">
      <label class="tm-felt">Dato<input type="date" name="dato" value="${GEM.dato}" required></label>
      <div class="tm-raekke" style="--n:3"><label class="tm-felt">Start<input type="time" name="fra" value="${GEM.fra}" required></label>
        <label class="tm-felt">Slut<input type="time" name="til" value="${GEM.til}" required></label>
        <label class="tm-felt">Pause (min)<input type="number" name="pause" value="${pause}" min="0" step="1" inputmode="numeric"></label></div>
      <div class="tm-obs" id="timer-gem-obs" hidden></div>
      <div class="tm-raekke"><label class="tm-felt">Fag<select name="fag">${SU.fag.map(f => `<option value="${esc(f.id)}"${f.id === g.fag ? " selected" : ""}>${esc(f.kort)}</option>`).join("")}</select></label>
        <label class="tm-felt">Aktivitet<input name="aktivitet" list="timer-aktiviteter" maxlength="60" placeholder="fx Øvelser" autocomplete="off"></label></div>
      <datalist id="timer-aktiviteter">${aktiv.map(a => `<option value="${esc(a)}">`).join("")}</datalist>
      <label class="tm-felt">Note<textarea name="note" maxlength="1000" placeholder="fx Forelæsning 7, slides 1-20"></textarea></label>
    </div>
    <div class="tm-fejl" id="timer-gem-fejl"></div>
    <div class="knapper"><button type="button" class="tm-knap ghost" data-gem="annuller">Annullér</button><button type="submit" class="tm-knap">Gem</button></div></form>`;
  el.showModal();
  gemObs();
}
// Start og slut som tidspunkter: slut før start betyder over midnat
function gemTider(f) {
  const a = new Date(`${f.dato.value}T${f.fra.value}`), z = new Date(`${f.dato.value}T${f.til.value}`);
  if (z <= a) z.setDate(z.getDate() + 1);
  const fraÆndret = f.dato.value !== GEM.dato || f.fra.value !== GEM.fra, tilÆndret = f.dato.value !== GEM.dato || f.til.value !== GEM.til;
  return { a: fraÆndret ? a.getTime() : GEM.start, z: tilÆndret ? z.getTime() : GEM.slut, fraÆndret, tilÆndret };
}
function gemObs() {
  const f = $("timer-gem-form"); if (!f) return;
  const { a, z } = gemTider(f), min = (z - a) / 6e4 - (+f.pause.value || 0), obs = $("timer-gem-obs");
  obs.hidden = min >= 5;
  obs.innerHTML = min < 1 ? "<b>OBS</b>Under et minut: intet bliver gemt." : "<b>OBS</b>Sessionen er under 5 minutter.";
}
$("timer-gem").addEventListener("input", gemObs);
$("timer-gem").addEventListener("click", async e => {
  const b = e.target.closest("[data-gem]"); if (!b) return;
  if (b.dataset.gem === "annuller") { $("timer-gem").close(); return; }
  if (!confirm("Kassér timeren? Sessionen bliver ikke gemt.")) return;
  $("timer-gem").close();
  timerHandling({ handling: "annuller" });
});
$("timer-gem").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, { a, z, fraÆndret } = gemTider(f), krop = { handling: "stop", slut: new Date(z).toISOString(), fag: f.fag.value,
    aktivitet: f.aktivitet.value, note: f.note.value };
  if (fraÆndret) krop.start = new Date(a).toISOString();
  if (f.pause.value !== String(GEM.pause)) krop.pause_min = f.pause.value === "" ? 0 : +f.pause.value;
  if (z > Date.now()) { $("timer-gem-fejl").textContent = "Slut kan ikke ligge ude i fremtiden."; return; }
  try {
    SU = await timerKald(krop); TM_FEJL = SU.besked || null;
    try { frame.contentWindow.postMessage({ kompas: "stopur" }, location.origin); } catch (err) {}
    $("timer-gem").close(); visTimer(true);
  } catch (err) { $("timer-gem-fejl").textContent = err.message; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("timer-pop").hidden) aabnTimer(false); });
hentTimer();
setInterval(tikTimer, 1000);
setInterval(hentTimer, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) hentTimer(); });

// The menu arrives from the projects; the frame can start loading meanwhile. It's fetched again every
// 10 minutes, so a new review or plan gets its dot while the page is open.
go(wanted());
loadNav().then(sync);
// The page already showing isn't marked as seen here: it shows what it loaded, not what's new.
setInterval(() => loadNav().then(() => sync(false)), 10 * 60000);
</script>

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, rigtige fejl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      # Kun regler, der finder fejl (ubrugte navne, udefinerede navne, syntaks), ikke stil
      - run: ruff check --isolated --select F,E9 .

  python:
    name: Demo og tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 er macOS' indbyggede Python, som demoen skal kunne køre på
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Demodata
        run: python demo/lav.py
      - name: Demo-serveren svarer på alle områder
        run: |
          python demo/serve.py --port 8000 &
          for i in $(seq 30); do curl -sf http://localhost:8000/ > /dev/null && break; sleep 1; done
          for u in / /kompas/ /kompas/forbindelser.json /form/coach.json /form/liv.json /form/belastning.json /studie/studie.json \
                   /studie/api/repetition /sprog/ /sprog/kompas.json /sprog/api/pakke /forbrug/data.json /forbrug/su/ /transactions; do
            kode=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$u")
            echo "$u $kode"
            test "$kode" = 200
          done
      - name: Tests (Overbliks statistik, coachens beregninger, Forbindelser)
        run: python -m unittest discover -s tests -v

  coach:
    name: Coach (smoke-test og pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Redigerbar, så site byg finder sidernes html i coach/site/ (testene i test_byg bygger rigtigt)
      - run: pip install -e './coach[dev]'
      - run: python coach/smoke_test.py
      - name: Fejl, kalender, Hevy, perioder og byg
        run: python -m pytest -q coach/tests

  overblik:
    name: Overblik (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Kilder, afvigelser, ugereview og uger
        run: python -m pytest -q overblik/tests
        env:
          PYTHONPATH: overblik

  node:
    name: Studie og Sprog (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntaks
        run: for f in studie/Scripts/*.js studie/Scripts/kompas/*.js sprog/*.js sprog/side/*.js; do node --check "$f"; done
      - name: Drill-gæt køres aldrig som kode
        run: node tests/test_drill_gaet.js
      - name: Gentagelsesplan og sync uden dubletter
        run: node tests/test_studie_repetition.js
      - name: Fagene fra fag.json (semester.js)
        run: node tests/test_studie_semester.js
      - name: Server og eksport på et andet semester, ingen faste fag i koden
        run: node tests/test_studie_fag.js
      - name: Nye kort på skift mellem fagene, ældste uge først
        run: node tests/test_studie_nye_kort.js
      - name: Samme uge i Fag og Ugeoverblik
        run: node tests/test_studie_sider.js
      - name: I dag viser resten, når én sektion fejler
        run: node tests/test_i_dag.js
      - name: Sprog (kommandoerne, Dagens kort, eksamensperiode og serveren)
        run: node tests/test_sprog.js

<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprog · Regler</title>
<!-- Sprogreglerne i Kompas (https://kompas.localhost/sprog/regler.html). Vises af ~/kompas/sprog/server.js og læser kun
     (/sprog/api/pakke). Reglerne skriver rutinen (sprog.js regel); hver regel øves med kort i Dagens kort, og "Øv reglen"
     åbner dens kort på Dagens kort-siden. Samme regler står under fanen Regler på telefonen. -->
<link rel="stylesheet" href="/kompas/assets/tokens.css">
<link rel="stylesheet" href="/kompas/assets/page.css">
<style>
  .wrap { max-width: 820px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13.5px; font-weight: 500; padding: 8px 12px; border-radius: 10px; background: var(--nav-indicator); color: var(--container); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Regler</h1>
      <p class="sub">De regler, du møder i kortene og ugens tekst, forklaret kort. Rutinen skriver én ny regel om ugen på spansk og én på dansk.</p>
    </div>
    <div class="seg" role="group" aria-label="Sprog" id="seg"></div>
  </header>
  <div class="stack" id="root"><div class="card empty">Henter …</div></div>
</div>

<script src="/kompas/assets/icons.js"></script>
<script src="/kompas/assets/liv.js"></script>
<script src="/kompas/assets/md.js"></script>
<script src="/sprog/regel.js"></script>
<script>
let P = null, valgt = null, seet = false;
const huskSprog = { hent: () => { try { return localStorage.getItem("sprog:regler-sprog"); } catch (e) { return null; } },
  gem: v => { try { localStorage.setItem("sprog:regler-sprog", v); } catch (e) {} } };

function vis() {
  const root = document.getElementById("root"), seg = document.getElementById("seg");
  const sprogene = Object.keys(P.sprog).filter(s => P.regler.some(r => r.sprog === s));
  if (!sprogene.length) {
    seg.innerHTML = "";
    root.innerHTML = `<div class="card empty">Der er ingen regler endnu. Rutinen Kompas · Sprog skriver den første på spansk og dansk søndag aften.</div>`;
    return;
  }
  // Et link til en regel (#da-nutids-r) viser reglens sprog med reglen foldet ud
  const åben = decodeURIComponent(location.hash.slice(1)), mål = P.regler.find(r => r.id === åben);
  if (mål && !seet) valgt = mål.sprog;
  seet = true;
  if (!sprogene.includes(valgt)) valgt = sprogene.includes(huskSprog.hent()) ? huskSprog.hent() : sprogene.includes(P.aktivt) ? P.aktivt : sprogene[0];
  seg.innerHTML = sprogene.map(s => `<button type="button" data-sprog="${esc(s)}" aria-pressed="${s === valgt}">${esc(P.sprog[s].navn)}</button>`).join("");
  root.innerHTML = `<div class="regler">${reglerFor(P.regler, valgt).map(r => {
    const n = P.regelkort.filter(k => k.regel === r.id).length;
    return regelHTML(r, P.sprog[valgt].stemme, { aaben: r.id === åben, fod: n ? `<a class="btn" href="/sprog/mobil.html#oev/${encodeURIComponent(r.id)}">${icon("check", 14)}Øv reglen (${n} kort)</a>` : "" });
  }).join("")}</div>`;
  document.getElementById(`regel-${åben}`)?.scrollIntoView({ block: "start" });
}
document.getElementById("seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  valgt = b.dataset.sprog; huskSprog.gem(valgt); vis();
});
(async () => {
  try {
    const r = await fetch("/sprog/api/pakke", { cache: "no-store" });
    P = await r.json();
    if (!r.ok) throw new Error(P.fejl || `svarede ${r.status}`);
  } catch (e) {
    document.getElementById("root").innerHTML = `<div class="card empty">Sprog-serveren svarer ikke (${esc(e.message)}).</div>`;
    return;
  }
  vis();
})();
</script>
</body>
</html>

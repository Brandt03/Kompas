<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karriere · Nye match</title>
<!-- Jobagentens side i Kompas (https://kompas.localhost/karriere/). Leveres af kompas_server.py i jobagent-mappen. -->
<link rel="stylesheet" href="/kompas/assets/tokens.css">
<link rel="stylesheet" href="/kompas/assets/page.css">
<link rel="stylesheet" href="karriere.css">
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Nye match</h1>
      <p class="sub" id="sub">Fra jobagenten</p>
    </div>
    <div class="seg" role="group" aria-label="Vis" id="filter">
      <button type="button" data-f="aabne" aria-pressed="true">Uafklarede</button>
      <button type="button" data-f="over" aria-pressed="false">Over tærsklen</button>
      <button type="button" data-f="fravalgt" aria-pressed="false">Fravalgt</button>
      <button type="button" data-f="alle" aria-pressed="false">Alle</button>
    </div>
  </header>
  <div class="stack" id="root"><div class="card empty">Henter …</div></div>
</div>

<script src="/kompas/assets/icons.js"></script>
<script src="/kompas/assets/liv.js"></script>
<script src="/kompas/assets/md.js"></script>
<script src="karriere.js"></script>
<script>
let D = null, filter = "aabne", aabenFravalg = null;
try { filter = localStorage.getItem("karriere-filter") || filter; } catch (e) {}
const inl = s => md(s || "").replace(/^<p>|<\/p>$/g, "");

function kort(j) {
  const hi = j.score != null && j.score >= D.taerskel, ud = udloebet(j);
  const stat = AABEN.includes(j.status) ? "" : `<span class="badge">${esc(STATUS_TEKST[j.status] || j.status)}</span>`;
  const plus = (j.hvorfor || []).map(x => `<li class="plus">${icon("check", 14)}<span>${inl(x)}</span></li>`).join("");
  const minus = (j.huller || []).map(x => `<li class="minus">${icon("activity", 14)}<span>${inl(x)}</span></li>`).join("");
  const handlinger = AABEN.includes(j.status)
    ? `<button type="button" class="btn" data-a="vil" data-id="${esc(j.id)}">${icon("check", 14)}Vil søge</button>
       <button type="button" class="btn ghost" data-a="nej" data-id="${esc(j.id)}">Ikke interesseret</button>`
    : j.status === "fravalgt" ? `<button type="button" class="btn ghost" data-a="fortryd" data-id="${esc(j.id)}">${icon("undo", 14)}Tilbage til uafklarede</button>`
    : `<a class="btn ghost" href="ansoegninger.html">${icon("kanban", 14)}Se i Ansøgninger</a>`;
  return `<article class="card job${ud ? " udloebet" : ""}" id="j-${esc(j.id)}">
    <div class="score${hi ? " hi" : ""}" title="Matchscore fra jobagenten (tærskel ${D.taerskel})"><b>${j.score ?? "–"}</b><small>match</small></div>
    <div>
      <div class="top"><h3>${esc(j.stilling)}</h3><div class="badges">${fristBadge(j)}${stat}</div></div>
      <div class="sub-line"><span><b style="color:var(--text-primary);font-weight:500">${esc(j.virksomhed)}</b></span>
        ${j.omraade ? `<span>${icon("map-pin", 13)}${esc(j.omraade)}</span>` : ""}<span>${esc(j.type || "")}</span>
        ${j.indrykket ? `<span>indrykket ${dayMonth(parseDate(j.indrykket))}</span>` : ""}</div>
      ${plus || minus ? `<ul class="why">${plus}${minus}</ul>` : ""}
      ${j.kort ? `<p class="kort">${inl(j.kort)}</p>` : ""}
      ${j.note ? `<p class="note">Din note: ${esc(j.note)}</p>` : ""}
      <div class="actions">${handlinger}<span class="spacer"></span>
        ${j.har_tekst ? `<button type="button" class="btn quiet" data-a="opslag" data-id="${esc(j.id)}">Opslaget</button>` : ""}
        ${jobLink(j, "btn quiet", `${icon("external-link", 14)}Jobindex`)}</div>
      ${aabenFravalg === j.id ? `<form class="fravalg" data-id="${esc(j.id)}"><input name="note" placeholder="Hvorfor ikke? Valgfrit, men agenten lærer af det" maxlength="300" autofocus>
        <button class="btn" type="submit">Fravælg</button><button class="btn quiet" type="button" data-a="annuller">Annullér</button></form>` : ""}
    </div></article>`;
}

function render() {
  const J = D.jobs, idag = iso(new Date());
  document.querySelectorAll("#filter button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));
  const r = D.seneste_rapport;
  document.getElementById("sub").textContent = r ? `Jobagenten kørte ${dayMonth(parseDate(r.dato))} · godt match fra score ${D.taerskel}` : "Jobagenten har ikke kørt endnu";
  // Højst max_uafklarede (config.json) uafklarede ad gangen; dem med lavest score skjules, men ligger under "Alle"
  const alleAabne = J.filter(j => AABEN.includes(j.status) && !udloebet(j)).sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
  const aabne = D.max_uafklarede ? alleAabne.slice(0, D.max_uafklarede) : alleAabne;
  const skjult = alleAabne.length - aabne.length;
  const snart = aabne.filter(j => { const f = frist(j); return f.dage != null && f.dage <= 3; });
  const iGang = J.filter(j => ["vil søge", "søgt", "samtale"].includes(j.status));
  const vis = {
    aabne: [...aabne], over: J.filter(j => AABEN.includes(j.status) && j.score >= D.taerskel),
    fravalgt: J.filter(j => j.status === "fravalgt"), alle: J,
  }[filter] || aabne;
  // Frister inden for 3 dage først, ellers højeste score; overskredne sidst
  const ordn = j => udloebet(j) ? 2 : (frist(j).dage != null && frist(j).dage <= 3 && AABEN.includes(j.status)) ? 0 : 1;
  vis.sort((a, b) => ordn(a) - ordn(b) || (b.score ?? 0) - (a.score ?? 0));

  document.getElementById("root").innerHTML = `
    ${r?.opsummering ? `<section class="card panel"><p class="lead" style="margin:0;font-size:15px;line-height:1.55">${inl(r.opsummering)}</p></section>` : ""}
    <section class="tiles">
      <div class="card tile"><div class="label">Uafklarede</div><div class="value">${aabne.length}</div><div class="foot">${skjult ? `${skjult} lavere match skjult` : "venter på dit valg"}</div></div>
      <div class="card tile"><div class="label">Gode match</div><div class="value">${aabne.filter(j => j.score >= D.taerskel).length}</div><div class="foot">score ${D.taerskel} eller mere</div></div>
      <div class="card tile"><div class="label">Frist inden 3 dage</div><div class="value">${snart.length}</div><div class="foot">${snart.length ? esc(snart.map(j => j.virksomhed).slice(0, 2).join(", ")) : "ingen travlhed"}</div></div>
      <a class="card tile" href="ansoegninger.html"><div class="label">I gang</div><div class="value">${iGang.length}</div><div class="foot">vil søge, sendt eller samtale</div></a>
    </section>
    <div class="jobs">${vis.map(kort).join("") || `<div class="card empty">${filter === "aabne" ? "Ingen uafklarede opslag. Agenten kigger igen i morgen kl. 7.30." : "Ingen opslag her."}</div>`}</div>
    ${filter === "aabne" && skjult ? `<p class="meta">${skjult} uafklarede opslag med score ${alleAabne[aabne.length]?.score ?? 0} eller lavere er skjult, så listen højst har ${D.max_uafklarede}. De ligger stadig under Alle.</p>` : ""}
    <p class="meta">Agenten søger aldrig selv. "Vil søge" flytter opslaget til Ansøgninger, hvor du selv holder styr på det. Dit fravalg og din note bruger agenten til at ramme bedre.</p>`;
}

async function opdater(besked, fortryd) {
  D = await hentData(); render();
  if (besked) toast(besked, fortryd);
}
async function skift(j, status, note) {
  const fra = j.status;
  try {
    await saetStatus(j.id, status, note);
    await opdater(status === "vil søge" ? `${j.virksomhed} flyttet til Ansøgninger` : status === "fravalgt" ? `${j.virksomhed} fravalgt` : "Flyttet tilbage",
      async () => { await saetStatus(j.id, fra); opdater("Fortrudt"); });
  } catch (e) { toast(`Kunne ikke gemme: ${e.message}`); }
}

document.getElementById("root").addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const j = D.jobs.find(x => x.id === b.dataset.id) || D.jobs.find(x => x.id === aabenFravalg);
  const a = b.dataset.a;
  if (a === "vil") skift(j, "vil søge");
  if (a === "nej") { aabenFravalg = j.id; render(); document.querySelector(".fravalg input")?.focus(); }
  if (a === "annuller") { aabenFravalg = null; render(); }
  if (a === "fortryd") skift(j, "vurderet");
  if (a === "opslag") visOpslag(j);
});
document.getElementById("root").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, j = D.jobs.find(x => x.id === f.dataset.id);
  aabenFravalg = null; skift(j, "fravalgt", f.note.value);
});
document.getElementById("filter").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f; try { localStorage.setItem("karriere-filter", filter); } catch (x) {}
  if (D) render();
});
hentData().then(d => { D = d; render(); }, e => { document.getElementById("root").innerHTML = fejlkort(e); });
</script>
</body>
</html>
